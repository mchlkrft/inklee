      `deposit_refunded_at` column). A partial refund of any size therefore renders the booking as
      refunded and removes the in-app refund path, and a second partial refund event, which carries
      a larger cumulative `amount_refunded`, is skipped by the count guard so the recorded amount
      stays stale."
