      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "fde77f0"
      environment: "repository-only"
      discovery_context: "Found during a four-agent code quality audit of all Opus 5 commits."
    location:
      files:
        - "apps/web/src/app/request/[token]/actions.ts:593"
        - "apps/web/src/app/request/[token]/actions.ts:606"
    evidence:
      observed_facts:
        - "actions.ts:593 deletes the order if order_items insert fails: await serviceClient
          .from('orders').delete().eq('id', orderId)."
        - "actions.ts:606 deletes the order if Stripe paymentIntents.update fails, same pattern."
        - "The order is created earlier in the function with a serviceClient insert. Between insert
          and delete, the order is visible to any service-role query."
        - "No status guard (e.g. .eq('status', 'draft')) on the delete, so it would delete an order
          in any state."
      references:
        - "apps/web/src/app/request/[token]/actions.ts"
      contradictory_evidence: "The order is created and potentially deleted within a single server
        action invocation. The window is small (two sequential async calls). The action is triggered
        by a form submission, and concurrent submissions for the same booking are unlikely in
        practice."
      inspected_comparables_without_issue:
        - "The existing deposit flow in bookings.ts uses a different pattern (update status rather
          than delete) which does not have this issue."
    assessment:
      interpretation: "A race between two form submissions could create two orders, then one deletes
        the other's order. Low probability in practice due to the short window and the booking token
        being single-use per customer action."
