  - id: "DATA-RACE-002"
    title: "0124's self-documented residual risks (timeout and deadlock) not recorded in the audit
      evidence register"
    summary: "0124_delete_collection_atomic.sql documents two residual risks at lines 71-85: (1) a
      populated+live collection with a concurrent membership write blocks until the writer finishes,
      and if it exceeds authenticated's 8s statement_timeout the caller gets 57014 with a wrong
      error message; (2) a deadlock (40P01) is newly possible because the function holds an
      exclusive row lock even on collections it refuses. Both are described as 'KNOWN, ACCEPTED,
      UNTESTED' in the migration itself but were not recorded in findings.yaml, meaning the accepted
      risk has no register entry and cannot be tracked or re-evaluated."
    classification:
      domain: "database"
      category: "process-gap"
      severity: "low"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "Opus 5 code quality audit: migration quality lens"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "fde77f0"
      environment: "repository-only"
      discovery_context: "Found during a four-agent code quality audit of all Opus 5 commits."
    location:
      files:
        - "apps/web/supabase/migrations/0124_delete_collection_atomic.sql:71-85"
    evidence:
      observed_facts:
        - "0124:71-78 describes the timeout risk: 'KNOWN, ACCEPTED, UNTESTED: the lock is taken
          BEFORE eligibility is known, so a refusal now waits too. A populated+live collection with
          a concurrent membership write in flight blocks until that writer finishes; if it exceeds
          authenticated's 8s statement_timeout the caller gets 57014, which collections.ts maps to
          the generic Couldn't delete rather than the correct archive it first.'"
        - "0124:80-85 describes the deadlock risk: 'A deadlock (40P01) is also newly POSSIBLE where
          the one-statement version had none, because this body holds an exclusive row lock even on
          collections it refuses. It needs two locking statements in ONE transaction to trigger, and
          deleteCollectionCore issues one RPC per PostgREST request, i.e. one transaction and one
          lock, so it is currently UNREACHABLE from the app.'"
        - "Neither risk has a corresponding entry in findings.yaml."
        - "0124:76-77 documents the timeout as 'Data-safe (verified: collection and membership both
          survive), but the wrong message.'"
        - "0124:85 documents the deadlock as unreachable: 'It becomes reachable the moment anything
          wraps this RPC in a larger transaction.'"
      references:
        - "apps/web/supabase/migrations/0124_delete_collection_atomic.sql"
      contradictory_evidence: "Both risks are explicitly documented in the migration file itself,
        which is a form of record. The register entry is specifically about making them trackable
        and re-evaluatable in the structured ledger."
      inspected_comparables_without_issue:
        - "DATA-RACE-001 (the TOCTOU defect that 0124 fixes) IS recorded in findings.yaml."
    assessment:
      interpretation: "The migration's self-documentation is thorough but lives in a file that is
        read during migration review, not during risk re-evaluation. The register is the structured
        record that surfaces for re-inspection."
      root_cause_hypothesis: "The risks were identified and documented during the same session that
        wrote the fix, and the register entry was deferred to a supervisor pass."
      reachability: "conditionally-reachable"
      impact_status: "latent"
      production_exposure: "The goods_collections capability is not yet granted, so the tables are
        empty and the collection delete path is unreachable. Both risks become live when collections
        are populated."
      remaining_uncertainty: "The deadlock risk is documented as currently unreachable. Whether any
        future code path wraps the RPC in a larger transaction is unknown."
    relationships:
      related_findings:
        - "DATA-RACE-001"
      analogous_uninspected_areas:
        - "Other migrations that self-document residual risks in comments but have no register entry."
    remediation:
      status: "accepted"
      proposed_action: "Both risks are accepted per the migration's own documentation. The timeout
        produces a wrong error message but is data-safe. The deadlock is currently unreachable. This
        register entry makes them trackable."
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Accepted risks. Timeout: wrong error message on 57014, data-safe. Deadlock:
        unreachable from current app code, becomes reachable if the RPC is wrapped in a transaction."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Cited by file and line only."
    history:
