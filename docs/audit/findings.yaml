        - "apps/web/supabase/migrations/0100_fee_sponsorship_booked_ledger.sql"
        - "AGENTS.md"
        - "apps/web/src/lib/server/order-fee-sync.ts"
      contradictory_evidence: "None. bcb45d5 explicitly retracts its predecessor's approach."
