        'sponsorship'."
      root_cause_hypothesis: "Confusing a record of intent with a record of effect. sponsored_fee_cents on
        the intent is the former; the settlement increment is the latter, and it is skippable on at
        least three reachable paths. Compounded by the counter being artist-GLOBAL, so an incorrect
        release is not a local error but a corruption of unrelated bookings' accounting."
      reachability: "directly-reachable"
      impact_status: "historically-impacting"
      production_exposure: "0099 and 0100 were applied to production (edb99fb: 'Applied to production and
