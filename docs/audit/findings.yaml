      environment: "repository-only"
      discovery_context: "Produced by an owner-authorized targeted audit scope opened 2026-07-30.
        Read-only inspection; findings returned for supervisor review rather than self-filed."
    location:
      files:
        - "apps/web/src/app/api/stripe/webhook/route.ts"
        - "apps/web/supabase/migrations/0099_release_fee_sponsorship_on_refund.sql"
    evidence:
      observed_facts:
        - "route.ts:645-652 `const { error: incError } = await
          serviceClient.rpc(\"increment_fee_sponsored_used\", ...); if (incError) {
          Sentry.captureException(...) } else {` — the stamp is in the `else`."
        - "route.ts:660-671 `const { error: bookedError } = await
          serviceClient.from(\"booking_requests\").update({ deposit_fee_sponsorship_booked_cents:
          sponsoredCents }).eq(\"id\", bookingId); if (bookedError) { Sentry.captureException(...)
          }` — captured, then execution continues and the handler still 200s."
        - "route.ts:57-59 `if (!Number.isFinite(args.bookedCents) || args.bookedCents <= 0) { return
          { retry: false }; }` — a zero booked value is a permanent no-op, not a retry."
        - "A second, independent route to the same state: `charge.refunded` reads
          `deposit_fee_sponsorship_booked_cents` at route.ts:190/208, so a refund event processed
          BEFORE the settlement event's stamp also reads 0, also returns retry:false, also 200s, and
          is never redelivered. Stripe does not guarantee event ordering."
        - "The release RPC itself is correct: migration
          0099_release_fee_sponsorship_on_refund.sql:52-89 takes `FOR UPDATE` on the booking,
          computes `v_delta := p_target_cents - v_already` and writes the target, i.e. it genuinely
          converges."
      references:
        - "apps/web/src/app/api/stripe/webhook/route.ts"
        - "apps/web/supabase/migrations/0099_release_fee_sponsorship_on_refund.sql"
      contradictory_evidence: "None recorded by the audit pass."
      inspected_comparables_without_issue:
        - "release_fee_sponsored_used (0099) — row-locked, converges to a target, floors at zero"
        - "The increment at :645 is a delta add, but it sits inside the once-only atomic flip gate
          (route.ts:578-602, `.eq(status,'deposit_pending').is(deposit_paid_at,null).select('id')`),
          so redelivery cannot double-count it"
    assessment:
      interpretation: "The converge-to-target rule (AGENTS.md) is honoured by the RPC and by the caller's
        ratio arithmetic. What is not protected is the INPUT to the convergence: `bookedCents` is a
        single non-retried snapshot read, so any way of observing it as 0 while the counter is
        non-zero produces a permanent, silent over-consumption of an artist-global cap."
      root_cause_hypothesis: "HYPOTHESIS: the two writes were treated as one logical operation because
        they are adjacent, and the comment was written about the pair rather than about each arm.
        Not confirmed."
      reachability: "conditionally-reachable"
      impact_status: "latent"
      production_exposure: "Only affects deposits where Inklee sponsored the fee (`sponsored_fee_cents`
        metadata present, set in bookings.ts:922-927) AND that are later refunded AND where one of
        the two windows above occurs. No evidence found of an occurrence."
      remaining_uncertainty: "Not executed. The ordering variant (refund event before settlement) is
        theoretically available because Stripe does not order events, but I did not establish that a
        refund can be issued before Inklee has processed the succeeded event in practice. The
        stamp-failure variant needs only one failed UPDATE and is the stronger of the two."
