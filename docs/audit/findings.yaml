  - id: "PAY-FEE-004"
    title: "Fee schedule v2 has no defined rate for a legacy_free_v1 artist who carries the deposits
      override"
    summary: "fee-schedule.ts keys rates on tier free|plus, and legacy_free_v1 resolves to 'free' via
      effectivePlanTier. Under v2, appointmentPayment.free is null and goods.free is 500 bps. A
      grandfathered artist who carries the deposits/Connect override CAN collect card payments, so
      under v2 they would be charged the free appointment rate (null -> feeMinorUnits returns 0 =
      0% fee) and the free goods rate (5%). Nobody has decided whether that is the intended
      grandfather benefit or leakage. The capability registry flags both cells UNDEFINED. Zero
      affected accounts today; the schedule must not activate with an undefined cell."
