          days). A generate_series anti-join returns exactly two missing days: 2026-07-19 and
          2026-07-28."
        - "apps/web/src/app/api/cron/growth-snapshot/route.ts:44-45 - `const day = requestedDay ??
          dayKeyInTimeZone(new Date(Date.now() - 86_400_000), tz)` - always exactly yesterday; the
          only other path is a manual ?date= backfill (:35-43)."
        - "metrics at :88-96 include point-in-time state (total_artists, activated_artists,
          onboarding_completed, books_open) computed from getAllArtistStats() at call time, not from
          dated source rows."
        - "The route's own comment at :17-22 states the table exists so growth history survives the
          cleanup and retention-purge erosion mechanisms."
        - "No alerting: grep for Sentry/captureException across apps/web/src/app/api/cron/ returns
