  - id: "AUTH-RLS-003"
    title: "product_collections RLS DELETE policy allows artists to bypass delete_collection_if_eligible
      safety check, cascade-deleting populated collection items"
    summary: "0121 creates an RLS DELETE policy on product_collections ('artist deletes own collections',
      for delete to authenticated using artist_id = auth.uid()). 0124 creates delete_collection_if_eligible
      as SECURITY INVOKER, which enforces an eligibility check (collection must be empty or archived)
      before deletion. Because the function is SECURITY INVOKER, it requires the DELETE policy to work.
      But the same policy also allows an artist to call PostgREST DELETE directly, bypassing the function's
      eligibility check entirely. The composite FK on product_collection_items uses ON DELETE CASCADE, so
      a direct delete of a populated collection destroys all membership rows — the exact data loss the
      function exists to prevent."
    classification:
      domain: "authorization"
      category: "missing-authorization"
      severity: "high"
      confidence: "high"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "Opus 5 code quality audit: RLS and authorization lens"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "fde77f0"
      environment: "repository-only"
      discovery_context: "Found during a four-agent code quality audit of all Opus 5 commits
        (2026-07-27 to 2026-07-30). The RLS agent identified the tension between SECURITY INVOKER
        needing the DELETE policy and the policy opening a bypass around the function's safety logic."
    location:
      files:
        - "apps/web/supabase/migrations/0121_product_collections_write_policies.sql:53-56"
        - "apps/web/supabase/migrations/0124_delete_collection_atomic.sql:97-160"
        - "apps/web/supabase/migrations/0122_collection_items.sql:102"
    evidence:
      observed_facts:
        - "0121:53-56 creates 'artist deletes own collections' on product_collections for delete to
          authenticated using (artist_id = auth.uid()). No WITH CHECK, no additional conditions."
        - "0124:97-103 declares delete_collection_if_eligible as SECURITY INVOKER, meaning it runs
          under the calling user's privileges and relies on the DELETE policy to perform the delete."
        - "0122:102 declares the composite FK with ON DELETE CASCADE, so deleting a parent row
          cascade-deletes all child product_collection_items rows."
        - "0124:88 documents the eligibility rule: memberCount === 0 || archivedAt. This check exists
          only inside the function, not in the RLS policy."
        - "PostgREST exposes DELETE on any table with an RLS DELETE policy, so an authenticated
          artist can call supabase.from('product_collections').delete().eq('id', x) directly."
        - "Grepped all of apps/web/src for product_collections combined with .delete(: zero application
          call sites. collections.ts calls only the RPC (delete_collection_if_eligible at line 216).
          Reachability is therefore via direct PostgREST REST call, not through the application."
        - "collection-delete-rpc.test.ts:21 states the RPC 'is the only path that deletes a
          collection.' This is false: the RLS DELETE policy is a second path. The only raw
          .from('product_collections').delete() calls in tests/db/ are service-role teardown helpers
          (collections-rls.test.ts:62, collection-items-rls.test.ts:80, helpers/actor.ts:75)."
        - "Dropping the 0121 DELETE policy does NOT fix the gap: 0124:49-55 documents that without
          the UPDATE policy, select ... for update matches ZERO rows and returns NO ERROR, so the
          locking read silently fails. The same applies to DELETE: the RPC's own delete from
          product_collections runs AS the calling artist and needs a permissive DELETE policy."
        - "Pushing the eligibility check into the RLS USING clause reintroduces the identical TOCTOU
          race 0124 was built to close: RLS's USING clause evaluates once against the snapshot at
          statement start, exactly like the one-statement version 0124 already proved unsafe."
      references:
        - "apps/web/supabase/migrations/0121_product_collections_write_policies.sql"
        - "apps/web/supabase/migrations/0124_delete_collection_atomic.sql"
        - "apps/web/supabase/migrations/0122_collection_items.sql"
        - "apps/web/tests/db/collection-delete-rpc.test.ts:21"
      contradictory_evidence: "The bypass requires the artist to circumvent their own UI, which always
        calls deleteCollectionCore (the function path). A direct PostgREST call deletes the artist's
        own data, not another user's. The severity is therefore about data integrity (accidental or
        programmatic self-harm) rather than cross-user authorization."
      inspected_comparables_without_issue:
        - "product_collection_items has no independent DELETE policy — it can only be deleted through
          the cascade or by the function, which is correct."
    assessment:
      interpretation: "The function's safety check is not enforceable at the database level because
        SECURITY INVOKER requires the same DELETE privilege that also enables the bypass. The
        structurally sound fix is converting to SECURITY DEFINER (so the internal DML no longer
        depends on the authenticated DELETE policy) and dropping the 0121 DELETE policy, making the
        RPC the only object capable of deleting a product_collections row. Both obvious alternatives
        were checked and fail: dropping the policy breaks the RPC, and inlining the check into the
        USING clause reintroduces the TOCTOU."
      root_cause_hypothesis: "SECURITY INVOKER was chosen deliberately (0124:93-96 explains why) to
        keep the function inside the artist's RLS boundary. The trade-off is that the eligibility
        check is advisory rather than enforced."
      reachability: "directly-reachable"
      impact_status: "latent"
      production_exposure: "No production incident. The goods_collections capability is not yet granted
        to any artist, so the tables are empty. The bypass becomes reachable the moment the capability
        is granted and collections are populated."
      remaining_uncertainty: "Whether the UI's exclusive use of the function is sufficient mitigation,
        or whether the direct PostgREST path must be closed."
    relationships:
      related_findings:
        - "AUTH-RLS-001"
        - "AUTH-RLS-002"
        - "DATA-RACE-001"
      analogous_uninspected_areas:
        - "Other tables where a function enforces business logic but RLS permits direct bypass: flash
          items, discount codes, any table with both a restrictive function and a permissive DELETE
          policy."
    remediation:
      status: "open"
      proposed_action: "Either make delete_collection_if_eligible SECURITY DEFINER and drop the RLS
        DELETE policy, or add a BEFORE DELETE trigger on product_collections that enforces the
        eligibility check at the database level."
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Not fixed and not verified."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Cited by path and line only."
    history:
      - date: "2026-07-30"
        actor: "Opus 5 code quality audit: RLS and authorization lens"
        action: "opened"
  - id: "PAY-CHK-001"
    title: "prepareCheckoutAction deletes orphaned order on failure without verifying concurrent state"
    summary: "apps/web/src/app/request/[token]/actions.ts:593 and :606 delete the just-created order
      if order_items insertion or Stripe paymentIntents.update fails. Between order creation and the
      compensating delete, a concurrent read (webhook, admin panel, polling) could observe and
      reference the order. The delete is not guarded by a status check, so a race between a successful
      checkout flow and a failed retry of the same form could delete an order that has already
      progressed."
