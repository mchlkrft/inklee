  - id: "WHK-SPN-001"
    title: "A failed sponsorship booked-stamp after a SUCCESSFUL increment leaves the cap permanently
      over-consumed, and the comment asserting otherwise only covers the other case"
    summary: "route.ts:637-673 increments the artist-global `fee_sponsored_used_cents` via RPC, then
      stamps `deposit_fee_sponsorship_booked_cents` on the booking. Both errors are captured to
      Sentry and swallowed. The comment at :654-659 justifies this as safe: 'Written only after the
      increment succeeded, so a swallowed failure above leaves it 0 and a refund correctly releases
      nothing.' That reasoning is sound for an increment failure and does not cover the stamp
      failure: if the increment succeeded and only the stamp failed, the counter genuinely carries
      the waiver while booked_cents reads 0, and releaseSponsoredFeeForRefund returns early at
      :57-59 on a zero booked value. The artist's global sponsorship cap is then consumed forever by
      a deposit that was refunded."
    classification:
      domain: "webhook"
      category: "money-correctness"
      severity: "medium"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "owner-authorized targeted audit: SCOPE 0A — Stripe deposit webhook (repo root
        A:/WORK/inklee, apps/web/"
      repository: "mchlkrft/inklee"
      branch: "master"
