        CORRELATED failure: one platform key fault degrading every artist simultaneously, each
        recoverable only by individual manual action. That is materially worse than the bug it was
        fixing, and only adversarial review distinguished them."
      root_cause_hypothesis: "A cached denormalisation of external system state was treated as
        authoritative, and the correction was written against the SDK's error taxonomy without
        checking how coarsely that taxonomy maps HTTP status to error class. A single 403 carries
        two very different meanings and only one is per-artist."
      reachability: "directly-reachable"
      impact_status: "historically-impacting"
      production_exposure: "The cached-state defect was live: real Connect accounts cached as active while
        invisible to the live key. The over-broad predicate existed only between 7e59c79 and 0a25c66
