        - "apps/web/src/lib/server/account-deletion-logic.ts"
        - "apps/web/src/lib/server/billing/cancellation.ts"
        - "apps/web/src/lib/server/billing/withdrawal.ts"
        - "apps/web/supabase/migrations/0106_billing_core.sql"
        - "apps/web/supabase/migrations/0020_account_status.sql"
    evidence:
      observed_facts:
        - "CURRENT-STATE FLOW, deleteOwnAccountCore (account-deletion.ts:71-295), one function, no
          transaction, seven steps. Callers: settings/account/actions.ts:43 (web, re-auth via
          isReauthFresh + type DELETE), api/mobile/account/route.ts:128 (same gates),
          admin/accounts/[id]/actions.ts:280 (admin, logs permanent_delete BEFORE calling, so a
          failed delete leaves a false admin-action record). Step 1 :76-114 reads stripe_account_id,
          auth email, deposit bookings, resolves refunded/forfeited from audit_log, categorizes.
          Guard :121 returns transient ERROR if Stripe is absent and live intents exist. Step 2
          :134-163 cancels each live unpaid PaymentIntent and re-reads status on failure; any
          unconfirmed cancel returns ERROR before anything irreversible. Step 3 :175-211 builds and
          inserts the pseudonymised archive, returning ERROR if it cannot persist. Step 4 :215-221
          deletes profiles - the cascade, and the only irreversible step. Step 5 :225-226 purges
          both storage buckets by prefix. Step 6 :229-242 deletes the auth user, tolerating
          not-found and writing an audit marker on other failures. Step 6b :250-271 redacts
          audit_log.details and admin_action_log.metadata. Step 6c :277-283 deletes mobile_waitlist
          rows by email. Step 7 :287-292 writes the account_deleted tombstone."
        - "FAILURE MODES, evidence-backed. (F1) Tax snapshot present: step 4 aborts P0001, account
          survives, client intents already cancelled, archive row already written, retry duplicates
          it, raw SQL text shown to the user - see BILL-DEL-TTSBLOCK. (F2) No tax snapshot: step 4
          succeeds and silently destroys eleven billing/tax tables while the Stripe subscription
          keeps renewing - see BILL-DEL-SUBLIVE and BILL-DEL-RETAIN. (F3) Post-step-4 partial
          failure: storage purge (:225) and the 6b/6c redactions have NO error handling and NO retry
          - the function proceeds and returns ok:true regardless. Only the auth delete surfaces
          (:231). (F4) Step 6 failure returns ok:false AFTER the profile is gone, so the caller
          shows 'try again' for an operation that can never be retried; only an audit marker records
          it. (F5) No idempotency key exists on the whole operation; re-entry is not detectable."
        - "STRIPE CAPABILITY ALREADY IN THE REPO: both semantics exist and are cleanly separated.
          Period-end = cancellation.ts:70-74, idempotency key `sub_cancel_eop_${id}`, already
          idempotent on cancel_at_period_end at :60. Immediate = withdrawal.ts:597,
          `stripe.subscriptions.cancel` with subscriptionIdempotencyKey('cancel', id). A target flow
          does not need new Stripe code, only orchestration."
        - "EXISTING STATE COLUMNS usable for the state machine: account_status / deleted_at /
          deleted_by / suspended_at / suspended_reason on profiles - see BILL-DEL-STATEENF for the
          enforcement caveat."
        - "TEST REALITY: the only deletion tests are
          apps/web/src/lib/__tests__/account-deletion-logic.test.ts (177 lines, three describes, all
          pure-function: categorizeDepositBookings, buildFinancialSnapshot, pseudonymizeOrder) and
          account-reauth.test.ts. apps/web/tests/db/ has 14 files, none about deletion. No test in
          the repo executes a profiles delete, so no existing test could have caught F1 or F2 - this
          is TEST-VAC-001's shape exactly."
      references:
        - "apps/web/src/lib/server/account-deletion.ts"
        - "apps/web/src/lib/server/account-deletion-logic.ts"
        - "apps/web/src/lib/server/billing/cancellation.ts"
        - "apps/web/src/lib/server/billing/withdrawal.ts"
        - "apps/web/supabase/migrations/0106_billing_core.sql"
        - "apps/web/supabase/migrations/0020_account_status.sql"
      contradictory_evidence: "None recorded by the audit pass."
      inspected_comparables_without_issue: []
    assessment:
      interpretation: "RECOMMENDED TARGET FLOW - a two-phase orchestration, not a single call. PHASE 0
        RESOLVE (read-only, no side effects): read live Stripe subscription state directly (never
        the cached mirror - PAY-CONN-001's lesson applies verbatim), read Connect balance and
        pending payouts, read unresolved deposits, read open withdrawal_cases. PHASE 1 GATE, the
        invariant: if billing state cannot be resolved (Stripe unreachable, ambiguous, or an open
        withdrawal case), REFUSE and change nothing. This is the owner's fail-safe and it must sit
        before any mutation - unlike today, where the Stripe work happens before the gate can fail.
        PHASE 2 TERMINATE BILLING: cancel per the ratified policy once it exists, verify by
        re-reading the subscription (the same confirm-by-re-read discipline account-deletion.ts:145
        already applies to PaymentIntents), and record the durable confirmation. PHASE 3 PRESERVE:
        copy every statutorily retained record into an FK-free archive BEFORE any delete, extending
        buildFinancialSnapshot with a subscriptions/invoices/tax section and bumping schemaVersion
        to 2. PHASE 4 EXECUTE: only now the profile delete. PHASE 5 SWEEP: storage, auth,
        redactions, tombstone - each individually retryable.


        TRANSACTION AND COMPENSATION BOUNDARIES. There is no distributed transaction available:
        Stripe and Postgres cannot commit together. Therefore (a) every Stripe mutation must be
        idempotency-keyed on a per-deletion identifier so a resumed run cannot double-act; (b) the
        archive write and the profile delete must be ONE database transaction, which today they are
        not - they are two separate supabase-js calls, so F1 leaves the archive committed with the
        profile alive. That pairing is the single highest-value structural change and it argues for
        a SECURITY DEFINER RPC exactly as 0124 did for deleteCollectionCore. (c) The only genuinely
        uncompensatable action is the deposit PaymentIntent cancel; it should move AFTER the Phase 1
        gate so it cannot fire on a run that was always going to refuse. (d) Compensation for a
        crash between phases is resumption, not rollback, which requires the run to be durable - see
        schema below.


        REQUIRED SCHEMA / STATE-MACHINE CHANGES (design only). 1. A durable deletion-run record: id,
        artist_id, requested_at, surface, phase, last_error, stripe_idempotency_scope, resolved
        billing snapshot. Without it, resumption and idempotency are impossible and every retry
        restarts from Phase 0. 2. A pending_deletion state on profiles, which needs the 0020 CHECK
        relaxed AND real enforcement at the access choke points (BILL-DEL-STATEENF). 3.
        Retention-safe FKs: the eleven cascading billing/tax tables must stop being CASCADE. Two
        candidate shapes - repoint to SET NULL with a retained pseudonymous artist reference, or
        keep the rows keyed to an archive row rather than to profiles. Which one depends on the
        unresolved legal question in BILL-DEL-RETAIN. 4. The tts_no_mutation trigger must become
        cascade-aware. NOTE THE TRAP: the tempting fix is to let the cascade through, which converts
        a hard failure into silent destruction of the exact record Terms promises to keep. The
        correct direction is to remove the cascade so the trigger never has to make an exception.


        MIGRATION IMPLICATIONS. Every one of these is a convergence hazard under the AGENTS.md rule:
        altering an FK's delete action and altering a CHECK constraint are both objects declared
        inline in a create table that already exists, so `create table if not exists` will skip them
        entirely and report success. Any migration here MUST use per-item existence guards or
        explicit drop-then-add against pg_constraint by name, and MUST be verified with `select
        conname, confdeltype from pg_constraint where conrelid='X'::regclass` rather than by
        re-running clean. Ordering matters too: relaxing the FKs before the orchestration exists
        widens the window where a delete silently destroys billing records (today the trigger
        accidentally prevents that), so the orchestration and the gate should land first.


        TEST PLAN, red-first, per the RLS-write-policy-gap lessons. Pre-name the red mutation for
        each: (T1) DB test - profile + tax snapshot, assert the delete FAILS with P0001 today, then
        assert it SUCCEEDS after the fix; positive control = same profile without a snapshot deletes
        cleanly (this exact pair already ran during this audit and both behaved as described). (T2)
        DB test - after deletion, assert billing_subscriptions and billing_consent_records rows for
        that artist STILL EXIST; this test must be capable of failing, so capture {error} on every
        setup write and assert row counts, never a bare not.toBeNull. (T3) Orchestration test -
        Stripe unreachable during Phase 0 must leave zero rows changed and zero PaymentIntents
        cancelled; assert by counting, not by absence of an exception. (T4) Idempotency - run the
        orchestration twice, assert exactly one deleted_account_records row (today there is no
        unique index, so this test fails by design until one is added). (T5) Webhook - an
        invoice.paid for a deleted artist must not 500; assert the specific response, not merely
        that it did not throw. (T6) The wrong-reason guard - each red test must be shown to fail for
        its own reason, since a globally broken fixture would make all six pass vacuously.


        ROLLBACK PLAN. Code: the orchestration ships behind a flag defaulting to the current path,
        so reverting is a flag flip plus redeploy, matching how the public map shipped. Schema:
        FK-action changes are individually reversible by name (drop constraint, re-add with the
        original confdeltype) and should be written with the reverse statement recorded in the
        migration comment. The pending_deletion CHECK value is additive and safe to leave in place
        on rollback. The one genuinely irreversible piece is the archive schemaVersion bump, so the
        reader must accept both versions from the start. Nothing in this plan should be rolled back
        by re-running a migration - the AGENTS.md non-convergence rule means the repair path is
        always the named object, verified in the catalog."
      root_cause_hypothesis: "n/a - design record."
      reachability: "unknown"
      impact_status: "unknown"
      production_exposure: "n/a - nothing implemented. Recorded so the next session does not redesign from scratch."
      remaining_uncertainty: "The design is unvalidated. Three inputs it depends on are unresolved: the
        ratification question in BILL-DEL-POLICY, the legal question in BILL-DEL-RETAIN (whether
        Stripe's own retention suffices, which decides whether the FK repointing is needed at all),
        and what Stripe permits for Connect account deletion in BILL-DEL-CONNECT. I did not
        prototype any of it."
    relationships:
      related_findings:
