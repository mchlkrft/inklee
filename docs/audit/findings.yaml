patterns:
  - id: "PAT-001"
    title: "A safety property is asserted in a comment or commit message before it has ever been
      executed, and the assertion then suppresses the next reader's inspection"
    description: "Across at least seven independent instances the repo shipped a written claim of
      correctness — 'atomic', 'idempotent', 'this sibling is fine', 'both locks cover this',
      'converges' — where the property had never been executed against a running system. In every
      case the claim was found false only when someone tried to REFUTE it rather than read it. The
      repo has begun naming this itself: commit 675152b calls it 'a comment asserting a safety
      property that has not been executed tells the next reader not to look'."
    related_findings:
      - "DATA-RACE-001"
      - "DATA-MIG-002"
      - "AUTH-RLS-001"
      - "AUTH-RLS-002"
      - "TEST-VAC-001"
    affected_domains:
      - "database"
      - "migration"
      - "authorization"
      - "testing"
    first_observed: "2026-07-29"
    last_observed: "2026-07-29"
    recurrence_count: 5
    shared_root_cause_hypothesis: "The repo's documentation culture is unusually strong — long, reasoned
      commit messages and heavily commented migrations — and that strength inverts into a hazard. A
      confident, well-argued comment is read as evidence. Nothing in the workflow distinguishes 'I
      reasoned this is true' from 'I executed this and observed it true', so the two are
      typographically identical in the artifact a future reader consults."
    supporting_evidence:
      - "9bb8d0a: 'Task #19 ... is NOT closed by this work, contrary to what the previous version of
        both comments asserted as fact. ... The claim was never executed. It is false.'"
      - "f090956 A3: '0121's comment cited discount_codes as a healthy precedent. It is not. ... a
        wrong \"this sibling is fine\" is worse than no comment at all.'"
      - "0b42f2d: '0125 declared six constraints INLINE in create table if not exists, so they did
        not converge, while the header claimed they did.'"
      - "675152b: 'The file's docstring opened \"TWO OBJECTS HOLD THIS, IN TWO DIFFERENT
        MIGRATIONS\" ... That lock was removed in the same commit, so the header asserted a property
        the code no longer has.'"
      - "AGENTS.md non-convergence footgun: 'Re-running had been certified idempotent on the basis
        that it does not error — which is a different property from converging to the intended
        schema.'"
      - "docs/product/p5d-gate-c-review.md:49-56 generalises it: 'A verdict is not a substitute for
        evidence on temporal claims ... a claim needs behavioural evidence when its truth depends on
        a SEQUENCE or a STATE TRANSITION.'"
      - "That same review document was created at 21458a0 (16:14:32) four minutes after 4d406f9
        (16:10:10) fixed the defects it describes as open, and still says at :124-126 the TOCTOU 'is
        still open' and at :130-133 that listCollectionsForArtist 'still discards both its errors' —
        both false against apps/web/src/lib/server/collections.ts:407-409 and :426-430 on master.
        Ordering verified with `git merge-base --is-ancestor 4d406f9 21458a0` = YES."
    contradicting_evidence: "The repo also produces the counter-example in quantity: 2035bf7's
      mutation-tested golden table, 4d406f9's named controls, 7d6773b's mutation against a deployed
      function body, and 0100's rolled-back-transaction verification are all executed evidence,
      correctly labelled. The pattern is therefore about an inconsistent standard rather than an
      absent one, and it appears to be actively correcting during the last week of the log."
    uninspected_comparables:
      - "The ~45 migrations whose headers make correctness claims I did not test (0067, 0070, 0075,
        0080, 0082, 0088, 0106 carry particularly long explanatory headers)."
      - "docs/ contains roughly twenty one-off audit documents (security-audit-2026-06-10.md,
        payment-audit-2026-06-03.md and -06-05.md, mobile-audit-2026-06-08.md,
        mobile-audit-2-2026-06-08.md, launch-readiness-audit.md,
        web-functionality-audit-2026-06-11.md, analytics-audit-2026-05-14.md,
        flash-parity-audit-2026-07-04.md, mobile-web-audit-2026-06-18.md,
        admin-growth-cockpit-audit.md, me15-tablet-audit.md, branding-ui-audit.md,
        nav-auth-ui-audit-slice-61.md, seo-geo-audit-slice-1.md, phase-d-audit-2026-05-24.md,
        docs/ux-audit/) that I did NOT open. Each is a candidate carrier of the same defect: a
        verdict recorded without executed evidence, now cited as authority."
    systemic_assessment: "systemic"
    confidence: "high"
    status: "active"
  - id: "PAT-002"
    title: "Independent adversarial verification is the only mechanism in this repo that has ever caught
      a defect in a fix, and on the money path it has caught one every ti"
    description: "Every fix in the money path and the RLS repair that was subjected to a separate
      reviewing role came back with real defects — frequently including a re-introduction of the
      very bug being fixed. Where author-only-verified fixes were later re-examined, they were
      wrong. The claim is not 'reviews find things'; it is that in this repo the author-verified
      pass rate on money and permission fixes is close to zero."
    related_findings:
      - "PAY-DEP-001"
      - "PAY-SPON-001"
      - "TEST-VAC-001"
      - "AUTH-RLS-002"
      - "PAY-FEE-001"
    affected_domains:
      - "payment"
      - "testing"
      - "authorization"
    first_observed: "2026-07-21"
    last_observed: "2026-07-30"
    recurrence_count: 5
    shared_root_cause_hypothesis: "An author verifies against their own model of the system, and every
      one of these defects is a defect IN that model — a wrong belief about what READ COMMITTED
      guarantees, what a 403 means, what intent metadata proves, which client performs a write. A
      test written from a wrong model tests the wrong model. Only a second party operating from a
      different model probes the assumption itself."
    supporting_evidence:
      - "0a25c66: 'Five real defects in the previous two commits, found by a 30-agent review of the
        money path' — including a re-opening of the exact silent degradation just fixed."
      - "bcb45d5: 'The review found two critical defects in the release I had just written.'"
      - "f090956: 'The Gate A specialist review returned CHANGES REQUIRED and was correct on every
        finding. The most important one was not about this branch.' A2 was found 'by checking A3's
        claim instead of taking it'."
      - "7679a0f: Gate A RE-review escalated again to CHANGES REQUIRED on two new HIGH findings, and
        a separate independent audit found the same shape in a third file 'not named in the
        review'."
      - "0b42f2d: 'Nine defects were confirmed BY EXECUTION after the authors had declared the work
        green'; 3fce7be: 'NINE DEFECTS FOUND BY EXECUTION AFTER THE CODE WAS DECLARED GREEN'."
      - "3fce7be's most pointed instance: the CRITICAL read-back defect was 'found in a fix the lead
        had just written by hand, after the lead had flagged exactly this risk in the verifier's
        brief and then not closed it.'"
    contradicting_evidence: "Three qualifications the register should carry. (1) The 'independent'
      verifiers are agent roles inside the same session, not separate people or separate time —
      weaker independence than the phrase implies. (2) The 2026-05-10 RLS incident had NO
      independent review at any point and its fixes have held for nearly three months, so
      author-only verification is not universally fatal. (3) 339bb72's 'anon REST count=0 on all 16
      public tables' is author-run but is a genuine behavioural measurement, which suggests the
      load-bearing axis may be EXECUTED-vs-ARGUED rather than INDEPENDENT-vs-AUTHOR. I would record
      both axes separately and let evidence accumulate before collapsing them."
    uninspected_comparables:
      - "Fixes that were author-verified and never independently re-examined: the entire 0026-0031
        RLS incident response, and effectively all pre-2026-07 history. Absence of later findings
        there is absence of looking, not absence of defects."
      - "The ~20 unopened audit documents in docs/ would materially move this pattern's evidence
        base in either direction."
    systemic_assessment: "systemic"
    confidence: "high"
    status: "active"
  - id: "PAT-003"
    title: "A PostgREST error is discarded, so a transient failure is indistinguishable from a
      legitimate empty result"
    description: "supabase-js returns errors in the result object rather than throwing. The idiom `const
      { data } = await supabase...` therefore turns a failed read into a falsy `data`, which the
      surrounding branch reads as the legitimate business answer \"there is nothing here\". On a
      money or deletion path the handler then reports success, and because the caller is often a
      webhook or a cron there is no human to notice. The same shape recurs in three unrelated
      subsystems written at different times."
    related_findings:
      - "PAY-DEP-001"
      - "WHK-ERR-001"
      - "CRON-CLN-001"
      - "CRON-PRG-001"
      - "CRON-CCH-001"
    affected_domains:
      - "payment"
      - "webhook"
      - "jobs"
    first_observed: "2026-07-21"
    last_observed: "2026-07-30"
    recurrence_count: 5
    common_characteristics:
      - "The destructure omits `error`, so nothing can act on it."
      - "The falsy result is then used as a NEGATIVE business fact rather than as an unknown."
      - "The caller returns success (HTTP 200, or a completed cron run), so the work is never
        retried."
      - "The path has no human observer, so the loss is silent rather than reported."
    shared_root_cause_hypothesis: "HYPOTHESIS: the idiom is correct for reads where an empty result IS
      the answer, and is copied unchanged to reads where it is not. Nothing in review distinguishes
      the two cases, and no lint rule or type makes the omission visible. Not established: whether
      any instance has actually fired in production."
    supporting_evidence:
      - "WHK-ERR-001: 17 of 23 Supabase calls in the 915-line deposit webhook omit `error`; the
        goods order flip at route.ts:718 then skips inventory, the confirmation email and the
        discount redemption, and returns 200 so Stripe never redelivers."
      - "PAY-DEP-001: the same class on the deposit path, found in production on 2026-07-21, and the
        reason AGENTS.md now carries the rule that a card deposit must never silently become
        manual."
      - "CRON-CLN-001, CRON-PRG-001, CRON-CCH-001: three independent instances in the cron
        endpoints, including a 7-year financial-retention lookup."
      - "The repo has already fixed instances twice with the reasoning written out:
        appointment-payment-intent.ts:439 \"THE READ FAILED, SO WE DO NOT KNOW ANYTHING\", and the
        P5d listCollectionsForArtist fix where a discarded error made productCount 0 and ENABLED a
        delete button on populated collections."
    contradicting_evidence: "Not universal. The newer P9 cores capture and act on the error
      (appointment-payment-intent.ts:406 claimError, :449 afterError), and stripe-connect.ts:670
      captures its UPDATE error. So the codebase demonstrably knows the correct shape; the pattern
      is about inconsistent application, not ignorance."
    inspected_without_pattern:
      - "apps/web/src/lib/server/appointment-payment-intent.ts (captures both errors)"
      - "apps/web/src/lib/stripe-connect.ts:670-682 (captures the UPDATE error)"
    uninspected_comparables:
      - "apps/web/src/app/api/email/webhook/route.ts"
      - "apps/web/src/lib/order-fulfillment.ts"
      - "apps/web/src/lib/server/discounts.ts recordDiscountRedemption"
      - "every remaining /api/mobile/* route"
    systemic_assessment: "systemic"
    confidence: "high"
    status: "active"
    auditor_sampling_targets:
      - "grep for `const { data }` with no `error` across apps/web/src and classify each by whether
        an empty result is a legitimate answer"
      - "every handler that returns 200 unconditionally"
    engineering_followup:
      - "Consider a lint rule or a typed wrapper that makes an unhandled PostgREST error a
        compile-time or CI error rather than a reviewer responsibility."
