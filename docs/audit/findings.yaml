  - id: "PAY-FEE-001"
    title: "Two live code paths computed the same PaymentIntent's platform fee from different sources;
      they agreed only because the active schedule made them agree"
    summary: "apps/web/src/lib/server/bookings.ts computed the deposit's application_fee_amount with
      platformFeeCents, a hardcoded 300 bps consulting neither tier nor fee schedule, while
      request/[token]/actions.ts went through resolveOrderFee -> computeOrderFees -> the schedule.
