  - id: "PAY-SPON-001"
    title: "Sponsorship waivers were released against PaymentIntent metadata (intent) rather than what
      settlement actually booked, erasing other bookings' real cap usage; and the first webhook
      release added a delta instead of converging to a target"
    summary: "Two sequential defects in the fee-sponsorship release path on 2026-07-21. First: releasing
      'proportional to amount_refunded' on each delivery would credit twice for two partial refunds
      and again on every redelivery, because charge.refunded carries CUMULATIVE amount_refunded and
      Stripe redelivers. Second, and worse: the release read sponsored_fee_cents from intent
      metadata, which records what Inklee INTENDED to waive, not proof the artist's global counter
      was ever charged — so releasing an unbooked waiver erased other bookings' real usage and let
      sponsorship exceed the cap."
