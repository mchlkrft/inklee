        - "apps/web/src/lib/server/appointment-payment-quote.ts:63-80"
        - "apps/web/src/lib/server/appointment-payment-quote.ts:644-656"
    evidence:
      observed_facts:
        - "appointment-payment-quote.ts:634-637 documents the gap: 'deposit and balance get nothing.
          A deposit precedes the final price by definition, and a balance's tattoo-service line is
          the REMAINDER, so treating it as the total would under-state the debt.'"
        - "appointment-payment-quote.ts:649-650: resolveFinalServicePrice returns stored if it is a
          number, returns null if collects !== 'full_price'. For deposit/balance, null is returned."
        - "appointment-payment-quote.ts:640: STORED_FINAL_SERVICE_PRICE_MINOR is described as 'null'
          — the production value, since A6 is not yet built."
        - "appointment-payment-quote.ts:63-66: 'The subject ceiling only exists when the artist has
          confirmed a final price.' Without it, there is no guard against over-collection."
      references:
