  - id: "AUTH-GRT-001"
    title: "All 107 public tables in production grant TRUNCATE to `authenticated`, and RLS does not gate
      TRUNCATE — a layer the codebase already treats as real for exactly one table"
    summary: "has_table_privilege('authenticated', c.oid, 'TRUNCATE') is true for every one of the 107
      base tables in production's public schema, including all 58 that have RLS enabled with zero
      policies. TRUNCATE bypasses row-level security entirely, so for those 58 tables the RLS
      default-deny that correctly blocks SELECT/INSERT/UPDATE/DELETE does not block emptying the
      table. seed.sql:54-70 shows the team already understands this layer and applied it to
      payment_allocations only — in migration 0125, which is not in production."
    classification:
      domain: "authorization"
      category: "missing-authorization"
      severity: "low"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "owner-authorized targeted audit: SCOPE 0B — production schema drift detection (method
        + first read-only"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "87ada6a"
      environment: "production"
      discovery_context: "Produced by an owner-authorized targeted audit scope opened 2026-07-30.
        Read-only inspection; findings returned for supervisor review rather than self-filed."
    location:
      files:
        - "apps/web/supabase/seed.sql"
        - "docs/audit/evidence/schema-drift-2026-07-30-prod-vs-local.json"
    evidence:
      observed_facts:
        - "Production: `select count(*) from pg_class ... where relkind='r' and
          has_table_privilege('authenticated', oid, 'TRUNCATE')` returns 107, which is every public
          base table."
        - "Production: 58 tables have relrowsecurity=true and zero rows in pg_policy; all 58 also
          carry the TRUNCATE grant."
        - "Production: pg_roles shows anon and authenticated with rolbypassrls=false, so RLS
          genuinely denies their SELECT/INSERT/UPDATE/DELETE on those 58 tables. Zero public tables
          have RLS disabled."
        - "No public function body in production matches the word `truncate` (`prosrc ~*
          '\\\\mtruncate\\\\M'` returns zero rows), so there is no RPC wrapper reaching it."
        - "Only 2 SECURITY DEFINER functions in production are executable by anon or authenticated:
          is_studio_owner(uuid) returns boolean, and sync_legacy_collection_membership() which
          returns `trigger` and therefore cannot be invoked directly."
        - "apps/web/supabase/seed.sql:54-70 documents the layer verbatim: 'RLS with no permissive
          policy already denies insert/update/delete, but TRUNCATE ignores RLS entirely' and records
          that a local `truncate payment_allocations` as authenticated SUCCEEDED before the revoke
          was added."
        - "payment_allocations does not exist in production (0125 unapplied), so the one table the
          codebase hardens is the one table this does not currently apply to."
      references:
        - "apps/web/supabase/seed.sql"
        - "docs/audit/evidence/schema-drift-2026-07-30-prod-vs-local.json"
      contradictory_evidence: "None recorded by the audit pass."
      inspected_comparables_without_issue:
        - "Production has zero public tables with RLS disabled — the condition that caused the
          2026-05 incident behind DATA-MIG-001 does not currently exist anywhere in the schema."
        - "Production has zero invalid indexes, zero disabled triggers and zero NOT VALID
          constraints."
        - "No table in production has RLS disabled while carrying policies (the inert-policy trap)."
    assessment:
      interpretation: "OBSERVED: the grant is universal and RLS does not cover it. INTERPRETATION: I could
        not find a reachable path. PostgREST maps HTTP verbs to SELECT/INSERT/UPSERT/UPDATE/DELETE
        and RPC only; there is no TRUNCATE verb, and no RPC reaches it. So exploiting this needs a
        direct Postgres session as `authenticated`, which needs credentials that would already grant
        more. This is recorded NOT as an exposure but because it is an unrecorded property of the
        entire production grant surface, because the grant comes from the Supabase platform's ALTER
        DEFAULT PRIVILEGES rather than from any Inklee migration, and because the codebase's own
        comment treats it as a defence worth having. Absence of a known path is not proof of
        unreachability."
      root_cause_hypothesis: "Supabase's platform default privileges (pg_default_acl for role postgres in
        schema public grants arwdDxtm to anon, authenticated and service_role) attach TRUNCATE to
        every table created by a migration. Nothing in the repository revokes it except 0125 for one
        table."
      reachability: "currently-unreachable"
      impact_status: "latent"
      production_exposure: "No path found from the public HTTP surface. Exposure is conditional on a
        future SECURITY INVOKER RPC that truncates, or on direct database access as the
        authenticated role."
      remaining_uncertainty: "I checked prosrc for the literal word truncate; a function that truncates
        via EXECUTE of a constructed string would not match. I checked `authenticated` only for the
        107-table count; `anon` was confirmed to hold TRUNCATE on at least
        founding_artist_applications (relacl arwdDxtm) but I did not count anon across all tables. I
        did not attempt any TRUNCATE against production and will not."
    relationships:
      related_findings:
        - "AUTH-RLS-001"
        - "AUTH-RLS-002"
        - "DATA-MIG-001"
      analogous_uninspected_areas:
        - "The same reasoning applies to REFERENCES and TRIGGER privileges, which are also in the
          blanket grant and also not gated by RLS; neither was assessed."
        - "Whether any Supabase Edge Function or cron job runs as `authenticated` was not checked."
        - "pg_default_acl differences between local and production were not diffed, so whether newly
          created production objects will keep inheriting this grant is assumed, not verified."
    remediation:
      status: "open"
      proposed_action: "Not yet actioned. Opened by a targeted audit."
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Not fixed and not verified."
