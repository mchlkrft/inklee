  - id: "WHK-TOK-001"
    title: "The customer's magic-link token is rotated inside the atomic settlement flip, then delivered
      by an email path that swallows every error and can never be retried"
    summary: "route.ts:574-602 mints a new token and writes only its SHA-256 hash in the same UPDATE
      that marks the deposit paid. The plaintext lives solely in the local variable `newToken`. It
      is delivered ~290 lines later by `sendBookingEmail`, whose implementation catches every error
      and only `console.error`s, so a Resend outage cannot produce a non-2xx and Stripe never
      redelivers. Even if it did, the redelivery is gated out: the booking is now `approved`, so
      `bookingTerminal` (:450) makes `bookingAlreadyDone` true and the whole booking-side block
      including the email is skipped. The old token's hash has already been overwritten, so the
      client's existing link is dead and the new one was never sent."
