        against master (apps/web/src/lib/server/collections.ts:407-409 and :426-430 both throw).
        Verified with `git merge-base --is-ancestor 4d406f9 21458a0` = YES. Do not cite that
        document for current state."
    relationships:
      analogous_uninspected_areas:
        - "Other multi-statement read-then-write sequences in apps/web/src/lib/server/ were NOT
          enumerated by me. 'Read a count, then act on it in a separate round trip' is generic and I
          checked only collections and payment-requests."
        - "Triggers elsewhere in the migration set that read a parent row without FOR UPDATE/FOR
          SHARE were NOT scanned."
      structural_patterns:
        - "PAT-001"
    remediation:
      status: "verified"
      fix_commit: "4d406f9"
      proposed_action: "Fix landed in 4d406f9 (0124 lock-then-recheck), 0b42f2d (0125 write-side lock)."
      fixed_at: "2026-07-29"
    verification:
      status: "passed"
      independent: true
      verified_by: "independent reviewer or verifier role, separate from the author"
      verified_at: "2026-07-29"
