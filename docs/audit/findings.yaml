  - id: "DRIFT-POL-001"
    title: "Production's booking_interests RLS policy name contains an embedded CRLF, so the house `drop
      policy if exists` repair pattern silently cannot address it"
    summary: "apps/web/supabase/migrations/0037_booking_interests.sql:40 creates policy \"artist can
      read and update own booking interests\". Production holds a policy on that table named
      \"artist can read and update own booking\\r\\n  interests\" (length 51, chr(10) at offset 40).
      The policy's SEMANTICS are identical on both sides, so there is no access-control difference
      today. The defect is that the name no longer matches any name a migration can write, and
      AGENTS.md's endorsed convergent repair pattern (drop policy if exists, then create policy) is
      name-keyed."
    classification:
      domain: "database"
      category: "schema-drift"
      severity: "medium"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "owner-authorized targeted audit: SCOPE 0B — production schema drift detection (method
        + first read-only"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "87ada6a"
      environment: "production"
      discovery_context: "Produced by an owner-authorized targeted audit scope opened 2026-07-30.
        Read-only inspection; findings returned for supervisor review rather than self-filed."
    location:
      files:
        - "apps/web/supabase/migrations/0037_booking_interests.sql"
        - "docs/audit/evidence/schema-drift-2026-07-30-prod-vs-local.json"
    evidence:
      observed_facts:
        - "Production pg_policies for booking_interests: one row, policyname length 51, chr(10) at
          position 40, cmd=ALL, permissive, roles={public}, qual=(artist_id = auth.uid()),
          with_check=(artist_id = auth.uid())."
        - "Local stack, same query: policyname \"artist can read and update own booking interests\",
          cmd=ALL, permissive, roles={public}, qual and with_check identical. Only the name
          differs."
        - "apps/web/supabase/migrations/0037_booking_interests.sql:40-42 is a single unwrapped LF
          line."
        - "AGENTS.md ('Convergent patterns') states drop-then-create is the strongest repair because
          it fixes a present-but-wrong-shaped object. That claim holds only when the name matches."
      references:
        - "apps/web/supabase/migrations/0037_booking_interests.sql"
        - "docs/audit/evidence/schema-drift-2026-07-30-prod-vs-local.json"
      contradictory_evidence: "None recorded by the audit pass."
      inspected_comparables_without_issue:
        - "All other 71 production policies matched local on tablename+policyname AND on cmd,
          permissive, roles, qual and with_check."
        - "1 storage policy and 4 storage bucket configs matched exactly."
    assessment:
      interpretation: "OBSERVED: two names, one semantic. INTERPRETATION: a future migration doing `drop
        policy if exists \"artist can read and update own booking interests\" on booking_interests;
        create policy ...` would no-op the drop in production and then successfully create a SECOND
        permissive ALL policy, leaving two. Because permissive policies OR together and both
        currently carry the same predicate, that would not by itself widen access — but a migration
        whose intent is to NARROW the policy would silently fail to do so in production while
        succeeding locally, and every local test would pass. That is the exact shape of DATA-MIG-002
        and TEST-VAC-001 combined."
      root_cause_hypothesis: "Same out-of-band application path as DATA-DRIFT-001 (adjacent migration,
        identical CRLF + two-space signature)."
      reachability: "currently-unreachable"
      impact_status: "latent"
      production_exposure: "None today: the predicate is identical. The exposure is prospective and
        conditional on a future narrowing migration."
      remaining_uncertainty: "I did not test the drop-no-op behaviour by execution (that would require
        writing to production, which is out of scope for this pass). The claim rests on Postgres
        name-matching semantics, not on an observed run. Also unverified: whether the policy being
        TO public rather than TO authenticated (true on BOTH sides, so not drift) matters here; the
        qual requires auth.uid() so anon cannot match, but that is reasoning, not a probe."
    relationships:
      related_findings:
        - "DATA-MIG-002"
        - "AUTH-RLS-001"
        - "AUTH-RLS-002"
        - "TEST-VAC-001"
