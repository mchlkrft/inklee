      environment: "repository-only"
      discovery_context: "Read-only inspection. Found by reading both files in the same batch and
        noticing the identical export name."
    location:
      files:
        - "apps/web/src/app/(artist)/bookings/books/actions.ts"
        - "apps/web/src/app/(artist)/settings/books/actions.ts"
