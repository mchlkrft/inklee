  - id: "OPS-CRD-001"
    title: "RISK INTRODUCED BY THIS REMEDIATION: an exported DATABASE_URL now outranks
      apps/web/.env.local in every governance recorder"
    summary: "To make the scripts runnable by CI and by a second operator, I gave
      process.env.DATABASE_URL precedence over apps/web/.env.local. That means a stray exported
      DATABASE_URL (for example a local Supabase left in the shell) will silently retarget a
      recorder the operator believes is pointed at production. I mitigated it with a mandatory
      one-line disclosure of host and source, but the mitigation is a printed line, not an
      enforcement."
