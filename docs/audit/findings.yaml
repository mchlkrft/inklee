        - "ROUND 3 — sentinel matched a comment. 0b42f2d: 'That test's first version was itself
          vacuous: it matched `prosrc like %for update%`, and the function's own body COMMENT
          contains that string, so it stayed green when the real lock was blanked.'"
        - "ROUND 3b — wrong object measured. 0b42f2d: 'The seven money-floor tests only exercised a
          DRAFT, where a check constraint independently forbids all seven, so they measured the
          constraint and not the policy.' And: 'The supersedes_foreign branch was measured by
          NOTHING: deleting it left all 152 db tests green.'"
        - "ROUND 4 — coverage hole in a critical fix. 3fce7be: 'deleting the whole `if (afterError)`
          guard left the entire unit suite green. The fixture could not express a failing read-back
          at all, only a null one.' Also: 'a test that passed by MUTUAL ZERO (both sides report a
          refusal as 0, so \"they agree\" meant \"neither charges\", not \"they agree on a
          rate\").'"
        - "COUNTER-EVIDENCE, the practice changing: 2035bf7 (2026-07-30) mutation-tests its own
          golden table — '8 single-change mutations each named in advance, restored from git between
          runs ... EVERY one of the 14 tests was killed by at least one mutation; none survived all
          eight. That is the property the 2026-07-29 RLS pass found missing when eight tests turned
          out to be incapable of failing.'"
        - "STRUCTURAL FIX: apps/web/tests/db/helpers/db-env.ts:21-23 'FAILS rather than skips. The
