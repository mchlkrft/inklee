  - id: "BDEL-TGT-001"
    title: "DESIGN RECORD (not a defect): target billing-aware deletion flow, boundaries, schema,
      migration, test and rollback plan"
    summary: "Design output for the authorized pass. Nothing here is implemented. The load-bearing
      constraint discovered during this pass is that the fail-safe the owner asked for cannot be
      built on the current cascade at all: the profiles delete is not a transaction boundary you can
      reason about, it is a single statement whose RI cascade can abort on a child trigger after the
      orchestrator has already taken irreversible Stripe action."
    classification:
      domain: "governance"
      category: "process-gap"
      severity: "informational"
      confidence: "high"
    discovery:
      detected_at: "2026-07-30"
