  - id: "PAY-RFD-001"
    title: "A fully refunded appointment payment request still reads `paid`: the refund converges the
      money and never moves the request's status"
    summary: "P9 slice A4's `charge.refunded` handler converges the allocation and the collection row
      correctly, then fails to move the payment request to `partially_refunded` or `refunded`. The
      convergence RPC writes the `refund_adjustment` row with a NULL `request_id` (deliberately, and
      documented as the contract A5 inherits), while `convergeRequestStatusAfterRefund` reads the
      request's allocations with `.eq(\"request_id\", requestId)`. That read can never return the
      row it is looking for, so the refunded total is computed as 0 on every call, an early return
      fires, and the guarded UPDATE that would move the status is never reached. The core returns ok
      with `statusMovedTo: null` and nothing is logged, so the caller reports success.
      `partially_refunded` and `refunded` are unreachable through this path today."
    classification:
      domain: "payment"
      category: "silent-failure"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "test-integrity engineer for P9 slice A4 (not the slice's author)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "9f55ab7"
      environment: "local"
      discovery_context: "Writing the first tests for A4's settlement path against a real local Postgres.
        Six assertions about the request's status after a refund went red on the first run of the
        new suite; the mechanism was then isolated."
    location:
      files:
        - "apps/web/src/lib/server/appointment-payment-settlement.ts"
        - "apps/web/supabase/migrations/0128_payment_settlement.sql"
        - "apps/web/tests/db/appointment-payment-settlement.test.ts"
      symbols:
        - "convergeRequestStatusAfterRefund"
        - "convergeAppointmentRefundCore"
        - "converge_payment_refund"
      database_objects:
        - "payment_allocations"
        - "payment_requests"
    evidence:
      observed_facts:
        - "OBSERVED, first run of apps/web/tests/db/appointment-payment-settlement.test.ts against
          the local stack: a request settled to `paid` for 9000, then a full `charge.refunded` for a
          cumulative 9000 converged, and `statusOf(requestId)` returned `paid`. `AssertionError:
          expected 'paid' to be 'refunded'`. Four more assertions failed the same way (partial
          refund: `expected 'paid' to be 'partially_refunded'`), and the core's own return carried
          `expected null to be 'partially_refunded'` for `statusMovedTo`."
        - "MECHANISM, read from source: 0128 line 355 inserts the refund row as `values
          (v_artist_id, v_booking_id, v_project_id, null, null, ...)`, whose fourth and fifth
          positions are `request_id` and `line_id`. appointment-payment-settlement.ts
          `convergeRequestStatusAfterRefund` reads
          `.from(\"payment_allocations\").select(\"component, amount_minor,
          status\").eq(\"request_id\", requestId)` and then `if (r.component ===
          \"refund_adjustment\") refundedMinor += -amount;`, followed by `if (refundedMinor <= 0)
          return { ok: true, requestId, statusMovedTo: null };`."
        - "MECHANISM, executed rather than only read: the tripwire test asserts on the stored rows
          that the `refund_adjustment` row has `request_id` null while the gross `full_price` row of
          the same intent carries the request id. Both assertions pass."
        - "THE MONEY HALF IS CORRECT and was measured separately: the refund row carries
          `booking_id`, so A1's `outstandingBalance` keyed on the SUBJECT sees it. After a 5000
          refund against a 10000 collection the balance reports `allocatedMinor 5000` and
          `remainingMinor 5000`. The defect is confined to the request's own status column."
        - "`paid -> partially_refunded` and `paid -> refunded` are both legal in
          PAYMENT_REQUEST_TRANSITIONS (packages/shared/src/appointment-payments.ts, `paid:
          [\"partially_refunded\", \"refunded\", \"disputed\"]`), so the guarded UPDATE's status
          filter is NOT the thing refusing. The UPDATE is never issued."
        - "THE CLAIM THAT MASKED IT. The A4 build's own handoff describes this path as working:
          'Request status then converges to refunded / partially_refunded through a guarded UPDATE
          whose from-set is derived from A1's transition table.' That is a description of the code
          as written, not an observation; the build's recorded probe evidence covers the RPC's
          tokens and the allocation amounts, and does not include a single request-status read after
          a refund."
      references:
        - "docs/product/plus-payments-architecture.md section 9 (refunds)"
        - "AGENTS.md, money path rule 4 (converge to a target)"
      reproduction: "apps/web/tests/db/appointment-payment-settlement.test.ts, the `it.fails` tripwire
        named 'TRIPWIRE (PAY-RFD-001): a converged refund does NOT move the request out of paid' in
        block 3. It passes while the defect stands and goes red the moment it is fixed. Run: `pnpm
        --filter inklee test:db` in apps/web against a local stack."
      contradictory_evidence: "None found. The opposite behaviour was looked for in two ways and neither
        produced it: the RPC returns `converged` (so the caller does reach the status step), and
        `convergeAppointmentRefundCore` returns a non-null `requestId` (so the owner lookup that
        precedes the failing read succeeds). The failure is specifically the second read."
      inspected_comparables_without_issue:
        - "`convergeRequestStatusAfterCollection` on the settlement path, which reads the same table
          with the same `.eq(\"request_id\", ...)` filter and IS correct, because the rows it needs
          (the gross allocations) do carry `request_id`. Proven by a mutation: changing that read to
          filter by payment_intent_id turns the remainder-collection test red."
    assessment:
      interpretation: "The money record and the human-readable state of a payment request have diverged,
        and only the second one is wrong. Anything that reads `payment_requests.status` (the
        artist's list, A6's client page, any later report) will describe returned money as paid.
        Anything that reads `payment_allocations` is correct."
      root_cause_hypothesis: "Two halves of one feature were designed against different keys and nothing
        executed the seam. 0128 chose a NULL `request_id` for the refund row on the grounds that
        Stripe's event carries no line or request attribution, and the TypeScript caller was written
        against the natural key for a per-request question. Each is defensible alone."
      reachability: "conditionally-reachable"
      impact_status: "latent"
      production_exposure: "NOT reachable in production today: A4 is uncommitted, the appointment webhook
        endpoint does not exist in Stripe (founder configuration, per the A4 handoff), and nothing
        calls A3's intent core because the client payment page is A6. Production was not read and no
        production claim is made beyond that."
      remaining_uncertainty: "Which of the two fixes is wanted is a contract decision, not a correctness
        one, and it was deliberately NOT made here. Reading by `payment_intent_id` is one line and
        changes nothing else, but it computes the gross across one intent rather than the request,
        which differs for a request collected twice. Giving the refund row a `request_id` matches
        the natural key but changes what 0128 documents as A5's inherited contract. Neither was
        implemented. Also unknown: whether any OTHER consumer already assumes the refund row's
        `request_id` is null."
    relationships:
      related_findings:
        - "PAY-WHK-001"
        - "PAY-FEE-002"
        - "TEST-VAC-001"
      structural_patterns:
        - "PAT-002"
      analogous_uninspected_areas:
        - "The DEPOSIT webhook's charge.refunded branch, which performs the same
          converge-to-a-target and then updates booking state. Whether its status write reaches the
          row it means to was not checked in this pass and no test imports that route."
        - "charge.dispute.* for appointment payments, which A4 deliberately defers to A5 and which
          has to move BOTH the allocations' status and the request's. It will meet exactly this
          seam."
        - "Every other place a plpgsql RPC writes a row and a TypeScript caller then reads that row
          back through PostgREST with a different filter: `delete_collection_atomic` (0124) and
          `send_payment_request` (0126) were not inspected for this shape."
    remediation:
      status: "open"
      proposed_action: "Decide the key, then make both halves use it. Either change
        `convergeRequestStatusAfterRefund` to read by `payment_intent_id` (and state what that means
        for a request collected against twice), or write `request_id` on the refund row in 0128 and
        say so in the contract note A5 inherits. Deleting the tripwire is not a fix."
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Not fixed. The tripwire keeps it visible and executable, and it fails loudly if
        somebody fixes the defect without removing the tripwire."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Cited by file, symbol and migration line. No secrets, personal data or production rows."
    history:
      - date: "2026-07-30"
        actor: "test-integrity engineer for P9 slice A4"
        action: "opened"
        note: "Found by the first test ever written against A4's settlement path. Recorded as an `it.fails`
          tripwire rather than patched, because the two candidate fixes carry different downstream
          contracts and choosing between them belongs to whoever owns A5."
  - id: "PAY-ORD-001"
    title: "The refund ordering guard compares a second-granularity clock with a strict `<`, so a stale
      `charge.refunded` created in the same second as the newest one is applied and walks the
      recorded refund backwards"
    summary: "`converge_payment_refund` (migration 0128) refuses an out-of-order refund event with `if
      v_last_event is not null and p_event_created < v_last_event then return 'stale'`. Stripe's
      `event.created` is a Unix timestamp in SECONDS, and `charge.refunded` fires once per refund,
      so two distinct refunds on one charge issued within the same second carry the SAME `created`.
      The strict `<` makes them indistinguishable from a redelivery of one event, so the older one
      is applied. Because the handler correctly writes the CUMULATIVE total absolutely rather than
      as a delta, applying the older event overwrites the newer total with a smaller one: the
      `refund_adjustment` allocation row and `payment_collections.refunded_total_minor` both move
      DOWN. The net of the intent's allocations then reports money as still collected that the
      client has already been refunded, which is the outstanding balance A5 and A6 read."
    classification:
      domain: "payment"
      category: "money-correctness"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "independent falsification pass on P9 slice A4, scope = convergence, idempotency and
        ordering (read-only on repo files, own fixtures)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "9f55ab7"
      environment: "local"
      discovery_context: "Assigned to refute A4's ordering claim by finding the window in which its
        monotonic guard does not apply. The guard's own documentation states that equal timestamps
        are applied deliberately; the reason it gives is true only for a redelivery of one event and
        was tested against that case only."
    location:
      files:
        - "apps/web/supabase/migrations/0128_payment_settlement.sql"
        - "apps/web/src/lib/server/appointment-payment-settlement.ts"
      symbols:
        - "converge_payment_refund"
        - "convergeAppointmentRefundCore"
      database_objects:
        - "payment_collections.refund_event_created"
        - "payment_allocations"
    evidence:
      observed_facts:
        - "apps/web/supabase/migrations/0128_payment_settlement.sql:304 `if v_last_event is not null
          and p_event_created < v_last_event then return 'stale';` — strict less-than."
        - "apps/web/supabase/migrations/0128_payment_settlement.sql:139-142 states the design
          intent: 'EQUAL TIMESTAMPS ARE APPLIED, not skipped: a plain redelivery of one event
          carries the same `created` and the same cumulative amount, so re-applying it writes the
          identical value and changes nothing.' Two DISTINCT refunds in one second also carry the
          same `created` and do NOT carry the same cumulative amount."
        - "EXECUTED, local stack, own fixture (10000 collected, one tattoo_service line): converge
          to 5000 at created=T, then converge to 3000 at created=T. Probe output `P2
          first(5000@T)=converged total=5000 | second(3000@T)=converged total=3000
          refundRow=-3000`."
        - "EXECUTED, the same window at full refund: converge to 10000 at created=T (net of the
          intent's allocations = 0, correct), then a same-second 2500. Probe output `P11
          netAfterFullRefund=0 netAfterStaleSameSecond=7500`. A fully refunded charge now reports
          7500 as still collected."
        - "CONTROL, same probe run: the ordinary out-of-order case IS refused. Sequence 3000@T,
          5000@T+10, 3000@T, 5000@T+10, 5000@T+10 produced `converged, converged, stale, unchanged,
          unchanged`, exactly one `refund_adjustment` row throughout, final -5000. The guard works
          whenever the seconds differ."
      references:
        - "AGENTS.md money-path rule 4 (webhook money operations converge to a target)"
        - "https://docs.stripe.com/api/events/object — `created` is a Unix timestamp in seconds"
      reproduction: "Against the local stack: settle an intent for 10000, then call
        `convergeAppointmentRefundCore` twice with `charge.amount_refunded` 5000 then 3000 and the
        SAME `eventCreated`. Read `payment_collections.refunded_total_minor` and the
        `refund_adjustment` allocation. Both end at 3000 / -3000. No test in
        apps/web/tests/db/appointment-payment-settlement.test.ts uses two distinct events with an
        equal `created`; block 2's stale case uses a strictly older one."
      contradictory_evidence: "Two refunds on one charge inside a single second is not the common case,
        and I did not establish a real Stripe trace of it. A5's refund product surface is unbuilt,
        so nothing in the repository issues refunds today; every refund is currently issued by hand
        in the Stripe dashboard, where two in one second is unlikely. The window is therefore latent
        rather than actively impacting, and its likelihood rises specifically when A5 ships per-line
        or batch refunds, which spec section 9 plans."
      inspected_comparables_without_issue:
        - "The lock itself is real and does its job. EXECUTED: an older event issued while a newer
          one held the `payment_collections` row in an open transaction blocked (`pg_blocking_pids`
          count 1, elapsed 1231ms) and answered `stale` after re-reading; the stored total stayed at
          the newer 7000. The two-statement lock-then-re-read shape of 0124/0125 is correctly
          implemented."
        - "billing_subscriptions.last_event_created (migration 0107), the pattern 0128 says it
          copies: worth the same question, but its events are subscription lifecycle transitions
          rather than cumulative money totals, so an equal-second pair there overwrites like with
          like."
    assessment:
      interpretation: "The guard is monotonic on the wrong resolution. It protects the case it was tested
        against (a strictly older redelivery) and admits the case that shares a second. Because the
        amount is written ABSOLUTELY, which is the correct convergent shape demanded by the
        money-path rule, admitting a stale event is worse here than an additive handler would be:
        the recorded refund does not merely fail to grow, it shrinks."
      root_cause_hypothesis: "The equality case was reasoned about only in terms of one event being
        redelivered. `p_event_created = v_last_event` conflates 'the same event again' with 'a
        different event from the same second', and only the clock is available to tell them apart."
      reachability: "conditionally-reachable"
      impact_status: "latent"
      production_exposure: "None. The appointment payment endpoint does not exist in Stripe (no
        `STRIPE_APPOINTMENT_WEBHOOK_SECRET` is configured), A4 is uncommitted, and 0128 has not been
        applied to production. I read nothing from production and touched nothing in Stripe."
      remaining_uncertainty: "I did not establish whether Stripe can emit two `charge.refunded` events
        with an identical `created` for one charge in practice, only that the field's resolution
        permits it and that the handler cannot distinguish them if it happens. I also did not check
        whether a refund FAILING (which 0128:130-137 cites as the reason the guard is on the clock
        rather than on the amount) is even deliverable here: `charge.refund.updated` is not in the
        endpoint's subscription, so the downward correction the clock guard exists to permit may
        never arrive."
    relationships:
      related_findings:
        - "PAY-RFD-001"
        - "PAY-WHK-001"
      structural_patterns:
        - "PAT-001"
      analogous_uninspected_areas:
        - "billing_subscriptions.last_event_created (0107) and its caller in
          apps/web/src/app/api/stripe/billing-webhook/route.ts: the same guard shape, never probed
          for the equal-timestamp case."
        - "The deposit webhook's own charge.refunded branch in
          apps/web/src/app/api/stripe/webhook/route.ts, which has no event-clock guard at all and is
          imported by no test."
        - "Any future charge.dispute.* handler (A5), which will meet the same seam with the same
          clock."
    remediation:
      status: "open"
      proposed_action: "Break the tie inside the second without giving up the clock. The minimal change is
        to refuse when `p_event_created < v_last_event OR (p_event_created = v_last_event AND
        p_refunded_total_minor < v_recorded)`, which restores upward-only ordering ONLY within one
        second and leaves the clock in charge across seconds, so the failed-refund case 0128
        documents still converges downward. Whichever fix is chosen, add a test that uses two
        DISTINCT events with an equal `created` and asserts both the allocation row and
        `payment_collections.refunded_total_minor`; the existing suite's stale case uses a strictly
        older event and cannot see this."
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Not fixed and not verified. Until it is, a refund total recorded by this handler can
        be lower than the amount Stripe actually returned, and nothing reconciles it (A8 is
        unbuilt)."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Cited by file, line and migration object. No secrets, no production rows, no
        Stripe identifiers."
    history:
      - date: "2026-07-30"
        actor: "independent falsification verifier for P9 slice A4"
        action: "opened"
        note: "Found by attacking the stated ordering guarantee rather than re-running the author's and the
          tester's scenarios. Both of those cover strictly-older events; the equal-second case was
          documented as safe and had never been executed."
  - id: "PAY-ORD-002"
    title: "A `payment_intent.succeeded` cannot move a request out of `failed`, so a collection recorded
      after a payment_failed on the same intent leaves the request permanently `failed` with the
      money already allocated, and says nothing"
    summary: "`recordAppointmentPaymentFailureCore` moves a request to `failed`. `failed` is absent from
      `STATUSES_SETTLING_TO_PAID` and `STATUSES_SETTLING_TO_PARTIALLY_PAID`, and `failed -> paid` /
      `failed -> partially_paid` are absent from A1's `PAYMENT_REQUEST_TRANSITIONS` altogether, so
      the settlement path can never recover it. A3 creates the PaymentIntent under an idempotency
      key derived from the request revision and amount, and reuses the stored intent while
      `payment_processing`, so a declined attempt and its retry are ONE intent id. Stripe's Payment
      Element re-confirms that same intent after a decline, and Stripe guarantees no ordering
      between `payment_intent.payment_failed` and `payment_intent.succeeded`, nor that a failed
      delivery is not redelivered later. When the failure lands first, the succeeded that follows
      writes the allocation rows, returns `ok: true, outcome: 'settled', statusMovedTo: null`,
      answers HTTP 200, and flags nothing. The money record and the request status disagree
      permanently and silently."
    classification:
      domain: "payment"
      category: "silent-failure"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "independent falsification pass on P9 slice A4, scope = convergence, idempotency and
        ordering (read-only on repo files, own fixtures)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "9f55ab7"
      environment: "local"
      discovery_context: "Constructing the 'an older event overwrites newer state' case across the two
        payment_intent events rather than within charge.refunded, which is where both the author's
        and the tester's ordering work is concentrated."
    location:
      files:
        - "apps/web/src/lib/server/appointment-payment-settlement.ts"
        - "packages/shared/src/appointment-payments.ts"
        - "apps/web/src/lib/server/appointment-payment-intent.ts"
      symbols:
        - "STATUSES_SETTLING_TO_PAID"
        - "convergeRequestStatusAfterCollection"
        - "recordAppointmentPaymentFailureCore"
        - "paymentIntentIdempotencyKey"
    evidence:
      observed_facts:
        - "apps/web/src/lib/server/appointment-payment-settlement.ts:137-149 derives the from-set as
          `PAYABLE_PAYMENT_REQUEST_STATUSES.filter(canTransitionPaymentRequest(from, target).ok)`;
          packages/shared/src/appointment-payments.ts:581-582 `PAYABLE_... = ['sent','viewed',
          'payment_processing','partially_paid']`. `failed` is not in it."
        - "packages/shared/src/appointment-payments.ts:500-507 `failed:
          ['payment_processing','expired', 'cancelled','partially_refunded','refunded','disputed']`
          — neither `paid` nor `partially_paid` is a legal target, so widening the intersection
          would not fix it."
        - "apps/web/src/lib/server/appointment-payment-intent.ts:330 creates the intent with
          `idempotencyKey: paymentIntentIdempotencyKey(quote.fingerprintSource)`;
          apps/web/src/lib/server/appointment-payment-quote.ts:571-579 the fingerprint is (request
          id, revision, currency, amount, fee, allocated, schedule version). A declined attempt
          changes none of them, so the retry resolves to the SAME PaymentIntent."
        - "EXECUTED, local stack, own fixture (8000, one tattoo_service line, collects full_price):
          `recordAppointmentPaymentFailureCore` then `settleAppointmentPaymentCore` on ONE intent
          id. Probe output `P5 fail=failed statusAfterFail=failed settle=settled/null
          statusAfterSettle=failed grossRows=1 sum=8000`. The 8000 is allocated; the request reads
          `failed`."
        - "The settle core returns `ok: true` on that path, so
          apps/web/src/app/api/stripe/appointment-webhook/route.ts:180-182 answers 200 and nothing
          is passed to `flagOrphaned`."
      references:
        - "docs/product/plus-payments-architecture.md section 8 (double-charge prevention)"
      reproduction: "Against the local stack: build a sent+claimed request, call
        `recordAppointmentPaymentFailureCore(admin, intent)` and then
        `settleAppointmentPaymentCore(admin, intent)` with the SAME intent id, and read
        `payment_requests.status` and the allocation sum. The existing suite's block 7 exercises the
        failure move and its recourse, and block 1 exercises settlement from `payment_processing`;
        no test composes the two in that order."
      contradictory_evidence: "The comment at appointment-payment-settlement.ts:752-766 argues that
        `failed` is the RIGHT resting state precisely because both parties can act from it, and that
        is correct on its own terms: `failed -> payment_processing` is legal and is in A3's
        `STATUSES_ENTERING_PROCESSING`, so a client who RELOADS the payment page re-claims the
        request and the subsequent success settles normally. The defect only bites when the
        successful confirm reaches Stripe without a fresh A3 claim in between, which is the in-place
        Payment Element retry and the out-of-order or redelivered failure. A6 (the client page) is
        unbuilt, so which of those the product will actually do is not yet decided."
      inspected_comparables_without_issue:
        - "The failure move is otherwise correctly scoped. It is pinned to `.eq('payment_intent_id',
          intent.id)` as well as to the status set, so a stale failure for a SUPERSEDED intent
          cannot fail a different attempt."
        - "The settle path's guard against walking BACKWARDS is sound and I executed both halves:
          with the request at `refunded` and at `partially_refunded`, a redelivered succeeded
          returned `already_settled` with `statusMovedTo: null` and left the status untouched."
    assessment:
      interpretation: "`failed` is a one-way door on a money path. The status machine treats it as 'this
        attempt is over' while Stripe treats the same PaymentIntent as still live, and the two
        disagree. The dangerous part is not the wrong status, it is that the handler that DOES
        record the money reports complete success while leaving it wrong, so there is no signal at
        all: no Sentry event, no non-2xx, no reconciliation (A8 unbuilt)."
      root_cause_hypothesis: "The from-sets are derived per target from the transition table, which makes
        each move individually defensible, and no rule anywhere asserts the composite property 'if
        allocations exist for this request, its status is not failed'. The invariant is not stated,
        so nothing enforces it."
      reachability: "conditionally-reachable"
      impact_status: "latent"
      production_exposure: "None. A4 is uncommitted, the Stripe endpoint does not exist, and no
        appointment payment can settle. I read nothing from production."
      remaining_uncertainty: "Whether A6's client page will re-claim through A3 before every confirm,
        which is what decides how often this fires. I did not measure how Stripe orders
        `payment_intent.payment_failed` and `payment_intent.succeeded` for one intent in practice,
        only that no ordering is guaranteed and that redelivery of the first is normal."
    relationships:
      related_findings:
        - "PAY-RFD-001"
        - "PAY-ORD-001"
      structural_patterns:
        - "PAT-003"
      analogous_uninspected_areas:
        - "The same composite invariant on the deposit path: a booking whose deposit PaymentIntent
          succeeded after a payment_failed. apps/web/src/app/api/stripe/webhook/route.ts is imported
          by no test."
        - "`expired` and `cancelled`, which are also reachable while a claimed intent is still live
          and are likewise absent from the settle from-set; I did not construct those."
    remediation:
      status: "open"
      proposed_action: "State the invariant and make the settlement path responsible for it. Either add
        `failed -> paid` / `failed -> partially_paid` to A1's table and to the settle from-set (a
        deliberate widening, since a succeeded is later evidence than a failed on one intent), or,
        if the state machine should stay as it is, have `convergeRequestStatusAfterCollection`
        detect that it wrote allocations and moved nothing and call `flagOrphaned`, so the
        divergence is at least loud. Silently returning `ok: true` is the part that must not survive
        either way."
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Not fixed and not verified. A request can hold a full collection and read `failed`
        to both the artist and the client, with no alert."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Cited by file, line and symbol. No secrets, no production rows."
    history:
      - date: "2026-07-30"
        actor: "independent falsification verifier for P9 slice A4"
        action: "opened"
        note: "Found by moving the ordering question off charge.refunded, where all prior work sits, and
          onto the pair of payment_intent events that share one intent id."
  - id: "PAY-FEE-003"
    title: "The fee-actuals write is the only write on the settlement path with no ordering guard and no
      derivation from stored state, so a later delivery overwrites it from whatever its payload
      says"
    summary: "`settleAppointmentPaymentCore` runs its `payment_collections` fee update on EVERY
      delivery, including the `already_settled` branch, and computes the values from the event
      payload rather than from the allocations already on disk. The allocations are immutable and
      protected by `payment_allocations_unique`; the fee row is not protected by anything. A second
      delivery for the same intent carrying different numbers replaces `application_fee_minor`,
      `appointment_base_minor` and `goods_base_minor` while the money record stands, leaving the two
      describing different collections. The same write also collapses `intent.application_fee_amount
      ?? 0`, which erases the null-versus-zero distinction migration 0128 explicitly created those
      columns nullable to preserve."
    classification:
      domain: "payment"
      category: "broken-invariant"
      severity: "low"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "independent falsification pass on P9 slice A4, scope = convergence, idempotency and
        ordering (read-only on repo files, own fixtures)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "9f55ab7"
      environment: "local"
      discovery_context: "Enumerating every write on the settlement path and asking of each one whether it
        converges to a target derived from stored state or merely trusts the newest payload. Three
        of the four converge; this one does not."
    location:
      files:
        - "apps/web/src/lib/server/appointment-payment-settlement.ts"
        - "apps/web/supabase/migrations/0128_payment_settlement.sql"
      symbols:
        - "settleAppointmentPaymentCore"
      database_objects:
        - "payment_collections.application_fee_minor"
        - "payment_collections.appointment_base_minor"
        - "payment_collections.goods_base_minor"
    evidence:
      observed_facts:
        - "apps/web/src/lib/server/appointment-payment-settlement.ts:583-599 sets `outcome =
          'already_settled'` on 23505 and CONTINUES; :618-634 the fee update then runs
          unconditionally, with values taken from `intent` and from the apportionment of THIS
          payload."
        - "apps/web/supabase/migrations/0128_payment_settlement.sql:99-103: 'All four are NULLABLE,
          and that is not laziness ... a NOT NULL DEFAULT 0 would make \"no fee was recorded\"
          indistinguishable from \"the fee was zero\", which is the same mistake as reading an
          unavailable lane as a 0% rate.' The caller writes `intent.application_fee_amount ?? 0`."
        - "EXECUTED, local stack, own fixture: settle intent X with amount_received 10000 and
          application_fee_amount 300, then deliver the same intent id with amount_received 1 and fee
          0. Probe output `P10 outcome=already_settled allocSum=10000
          feeBefore={application_fee_minor:300, appointment_base_minor:10000}
          feeAfter={application_fee_minor:0, appointment_base_minor:1}`. The allocations correctly
          did not move."
      references:
        - "AGENTS.md money-path rule 4"
      reproduction: "Call `settleAppointmentPaymentCore` twice for one intent id with different
        `amount_received` / `application_fee_amount`, then read `payment_collections`. No test
        asserts the fee row after a redelivery that disagrees with the first; the suite's redelivery
        test replays an identical payload, and its died-halfway test nulls the columns and asserts
        they are caught up, which is the case this write handles correctly."
      contradictory_evidence: "I could not construct a Stripe-realistic trigger. For one PaymentIntent,
        `amount_received` and `application_fee_amount` are fixed once it succeeds, so two
        `payment_intent.succeeded` deliveries should carry identical values and this write is then
        genuinely idempotent, which is what its comment claims. The unconditional write is also what
        makes the die-halfway recovery work, so removing it would be wrong. On the null collapse, A3
        sets `application_fee_amount` at creation, so a null on the event usually does mean zero."
      inspected_comparables_without_issue:
        - "The three other writes on this path do converge: the allocation insert is one statement
          and 23505-tolerant, the refund is an absolute set inside a row lock, and the two status
          moves put their test in their own UPDATE qual."
    assessment:
      interpretation: "Not a live money defect, and I am not claiming one. It is the single place on this
        path where the invariant 'the derived rows describe the money rows' rests on Stripe sending
        the same numbers twice rather than on anything in this system. That is the property the
        money-path rule asks writes on this path to have, and it is worth knowing it is absent here
        before A8 starts reconciling against these columns."
      root_cause_hypothesis: "The fee actuals were treated as 'absolute values, so writing twice writes
        the same numbers', which is true of the VALUES and not of their SOURCE: they are absolute
        with respect to the payload, not with respect to the stored allocations."
      reachability: "conditionally-reachable"
      impact_status: "theoretical"
      production_exposure: "None. A4 is uncommitted and 0128 is not applied to production."
      remaining_uncertainty: "Whether Stripe can ever deliver two `payment_intent.succeeded` events for
        one intent with differing `application_fee_amount`. I did not establish that it can, and if
        it cannot this stays theoretical."
    relationships:
      related_findings:
        - "PAY-FEE-002"
        - "PAY-ORD-001"
      structural_patterns:
        - "PAT-001"
      analogous_uninspected_areas:
        - "The deposit path's `platform_fee_collected_cents` write, which 0128 cites as the
          precedent for this shape and which I did not read."
    remediation:
      status: "open"
      proposed_action: "Derive the fee bases from the allocations that are actually stored for the intent
        rather than from the payload's apportionment, so the fee row cannot describe a different
        collection from the money row. Separately, write `intent.application_fee_amount` through
        unchanged, including null, so the column keeps the distinction 0128 created it to keep."
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Not fixed and not verified."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Cited by file and line. No secrets, no production rows."
    history:
      - date: "2026-07-30"
        actor: "independent falsification verifier for P9 slice A4"
        action: "opened"
        note: "Opened at low severity with the contradictory evidence stated first: the trigger is
          hypothetical, the structural property is not."
  - id: "ABUSE-PUB-001"
    title: "The public project intake server action has none of the five abuse controls its direct
      sibling, the public booking intake, applies — no honeypot, no origin check, no rate limit, no
      image MIME allowlist and no dedupe"
    summary: "submitProjectIntakeAction is unauthenticated, reachable by anyone who knows an entitled
      artist's slug, accepts up to 12 files totalling 40 MB, decodes each through sharp, writes them
      to private storage, inserts a project row, and sends two emails — one of them to an
      ATTACKER-SUPPLIED address. The comparable public form in the same repository,
      submitBookingAction, gates the identical shape of work behind a honeypot, an origin check, a
      per-artist-per-IP rate limit, an image MIME allowlist and a fingerprint dedupe. The project
      intake applies none of the five. This is the newer of the two (Plus build P4) and it is the
      only public form in the codebase that imports neither @/lib/honeypot nor @/lib/ratelimit."
    classification:
      domain: "public-surface"
      category: "availability"
      severity: "high"
      confidence: "high"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "owner-authorized targeted audit: mobile API routes and server actions
        (authentication, ownership, validation, error handling, IDOR, revalidation)"
      repository: "mchlkrft/inklee"
      branch: "feat/p5d-collections"
      commit: "9f55ab7"
      environment: "repository-only"
      discovery_context: "Read-only inspection of 17 mobile API routes and 18 server-action files
        commissioned because Opus 5 authorship was flagged as a quality risk. Reported to the
        supervisor rather than self-filed as fixed."
    location:
      files:
        - "apps/web/src/app/[slug]/project/actions.ts"
        - "apps/web/src/lib/server/projects.ts"
        - "apps/web/src/app/[slug]/actions.ts"
        - "apps/web/src/app/[slug]/project/project-form.tsx"
      symbols:
        - "submitProjectIntakeAction"
        - "submitProjectIntakeCore"
    evidence:
      observed_facts:
        - "apps/web/src/app/[slug]/project/actions.ts:20-71 is the whole action. It reads a slug,
          resolves the artist with the service client, collects files and calls the core. It
          performs no honeypot check, no origin check and no rate-limit check."
        - "grep for importers of @/lib/ratelimit across apps/web/src returns 22 files;
          apps/web/src/app/[slug]/project/actions.ts is not among them. grep for importers of
          @/lib/honeypot returns 8 files; it is not among them either. Every other public
          (unauthenticated) submit path IS in both lists or in the honeypot list: [slug]/actions.ts,
          [slug]/flash/[flashSlug]/actions.ts, legal/report/actions.ts, download/actions.ts."
        - "apps/web/src/app/[slug]/actions.ts:56 (honeypot), :62-69 (isAllowedBookingOrigin), :89
          (checkRateLimit per IP per artist), :242-247 (per-file size AND ALLOWED_IMAGE_TYPES MIME
          check before processImage), :320-362 (60-second fingerprint dedupe) — the five controls
          the sibling applies to the same class of work."
        - "apps/web/src/lib/server/projects.ts:100-123 enforces PROJECT_MAX_IMAGES (12),
          PROJECT_MAX_IMAGE_BYTES (10 MB) and PROJECT_MAX_TOTAL_BYTES (40 MB) — size only. There is
          no file.type allowlist anywhere on this path, unlike the booking path which checks MIME
          before handing bytes to sharp."
        - "apps/web/src/lib/server/projects.ts:266-271 sends sendProjectReceivedClient to
          data.customerEmail, which is attacker-supplied request input, and :275-286 sends a second
          email to the artist. Both run once per accepted submission."
        - "apps/web/src/app/[slug]/project/project-form.tsx contains two hidden inputs (a per-key
          marker at :44 and the slug at :99) and no honeypot field, so the control is absent from
          the client as well as the server, not merely unread."
        - "apps/web/src/app/[slug]/project/page.tsx:36-51 gates RENDERING on account_status active
          plus largeProjectsAllowed, and apps/web/src/lib/server/projects.ts:67-79 re-checks the
          entitlement before any parse or image work — so a non-entitled artist's slug is a cheap
          refusal. The exposed surface is the set of entitled artists, not every artist."
      references:
        - "apps/web/src/lib/ratelimit.ts:60-66 — the reportRl comment states the exact reasoning
          this path is missing: 'Each accepted call sends two emails (operator + reporter ack) with
          attacker-supplied text, so cap to prevent using it as a mail relay / inbox flood.'"
      contradictory_evidence: "Two real mitigations exist and are recorded so this is not overstated.
        (1) The entitlement gate runs FIRST in the core, before zod parsing and before any image
        work, so the expensive path is only reachable through an entitled artist's slug. (2)
        guardedSharp (apps/web/src/lib/image-guard.ts:19-26) caps decoded pixels at 50 MP on every
        sharp pipeline including this one, so the classic decompression-bomb OOM is already blunted
        even without a MIME allowlist."
      inspected_comparables_without_issue:
        - "apps/web/src/app/legal/report/actions.ts — the other unauthenticated email-sending action.
          Honeypot at :60, rate limit at :67-74, length caps on every field, HTML-escapes every
          interpolated value at :35-42. Inspected and sound."
        - "apps/web/src/app/request/[token]/actions.ts — unauthenticated but token-gated. Rate limits
          by token hash (:47, :173, :330), enforces a 30-day expiry, uses status-gated conditional
          UPDATEs with rowcount checks, and allowlists add-on selections against
          artist-confirmed booking_interests rows (:432-469). Inspected and sound."
        - "apps/web/src/app/[slug]/actions.ts submitWaitlistAction — honeypot at :733, rate limit at
          :771. Inspected and sound."
    assessment:
      interpretation: "OBSERVED: the five controls are absent, and present on the sibling. INTERPRETATION:
        the reachable abuse is (a) using Inklee's sending domain to deliver Inklee-branded mail to
        an arbitrary third-party address at whatever rate the attacker chooses, which is a sender-
        reputation and inbox-flood problem before it is anything else, (b) unbounded writes to the
        projects table and the private bookings bucket, which is storage cost with no cleanup path,
        and (c) unbounded sharp invocations, bounded per-call by the 50 MP guard but not bounded in
        rate. The artist's own inbox is also floodable. I did not attempt any of this."
      root_cause_hypothesis: "The project intake was written as a new core (submitProjectIntakeCore) rather
        than by extending the booking intake, and the abuse controls live in the booking ACTION
        rather than in a shared submit helper. Nothing structural carries them across, so a second
        public form starts with none of them and nothing fails when they are missing."
      reachability: "directly-reachable"
      impact_status: "latent"
      production_exposure: "Reachable in production against any artist entitled to large projects. Whether
        any such artist exists in production today was NOT checked; the entitlement is Plus-gated
        and Plus consumer billing is launch-held, so the current population may be small or empty."
      remaining_uncertainty: "I did not send a single request to this endpoint, in production or locally,
        so every statement here is from reading. I did not check how many production artists hold
        largeProjectsAllowed. I did not measure sharp's actual cost per 10 MB input. I did not check
        whether Vercel's platform-level DDoS mitigation or any WAF rule already caps this route. I
        did not verify whether the email provider applies its own per-recipient throttling that
        would blunt the relay use."
    relationships:
      related_findings: []
      analogous_uninspected_areas:
        - "apps/web/src/app/[slug]/flash/[flashSlug]/actions.ts imports BOTH honeypot and ratelimit,
          so it is presumed protected, but I read only the import list, not the call sites — it was
          not in my assigned scope and is NOT inspected."
        - "apps/web/src/app/download/actions.ts is in the ratelimit list but NOT in the honeypot
          list. Whether that is deliberate (it is a plain waitlist signup) or the same omission was
          not established."
        - "Every /api/mobile/* route relies on requireMobileUser and none of the routes I read
          carries a rate limit except events/route.ts and settings/connect-link/route.ts. The
          authenticated-but-unthrottled write routes (goods, travel, booking-form fields) were not
          assessed for abuse volume."
        - "The project intake's uploaded storage objects have no orphan-cleanup job that I looked
          for. Whether one exists was not checked."
    remediation:
      status: "open"
      proposed_action: "Not actioned by this pass. The obvious shape is the sibling's: honeypot field +
        isAllowedBookingOrigin + a new per-IP-per-artist limiter in lib/ratelimit.ts + a MIME
        allowlist before processImage. Worth considering whether the five controls should move into
        a shared public-submit helper so a third public form cannot start empty again."
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Not fixed and not verified. The finding itself rests on reading, not on execution."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Described by control name, file and line. No request payloads, no runnable
        steps, no secrets, no production data."
    history:
      - date: "2026-07-30"
        actor: "owner-authorized targeted audit: mobile API routes and server actions"
        action: "opened"
        note: "Found by comparing each public entry point against its nearest sibling rather than
          reading each in isolation."
  - id: "DRIFT-ACT-001"
    title: "Two independent implementations of saveBooksSettingsAction are both wired to live forms,
      and they disagree about whether opening or closing the books is audited"
    summary: "apps/web/src/app/(artist)/bookings/books/actions.ts and
      apps/web/src/app/(artist)/settings/books/actions.ts each export a function named
      saveBooksSettingsAction that writes the same profiles.settings.books_settings object. Both are
      imported by a real form. They differ in three ways, and the load-bearing one is that only the
      first writes the books_opened / books_closed audit entry. Closing the books from
      /settings/books therefore leaves no audit trail, and leaves /bookings/books and
      /bookings/settings rendering the previous state."
