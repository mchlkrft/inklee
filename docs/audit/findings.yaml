        - "The cron fires at 09:00 UTC (vercel.json), observed today at 09:32 UTC. At that instant
          an artist at UTC-10 or further west is still on the previous local date, so their days=1
          target equals server today+0, below windowStart of today+1. Same arithmetic sinks days=3
          reconfirmation against a +3 windowStart."
        - "PROD: 0 of 20 profiles have a timezone with utc_offset <= -10 hours (and 0 at >= +10); 7
          distinct offsets are in use."
