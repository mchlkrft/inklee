  - id: "BDEL-TTS-001"
    title: "An append-only trigger on transaction_tax_snapshots aborts the profiles cascade, so account
      deletion fails permanently after irreversibly cancelling the client's deposit PaymentIntents"
    summary: "transaction_tax_snapshots.artist_id is ON DELETE CASCADE from profiles, but the same table
      carries a BEFORE DELETE OR UPDATE trigger that unconditionally RAISEs. The referential-action
      cascade issues a DELETE against the child, the trigger fires, and the whole profiles DELETE
      aborts with SQLSTATE P0001. Because account-deletion.ts cancels live unpaid deposit
      PaymentIntents (step 2) and inserts the retained financial archive (step 3) BEFORE the
      profiles delete (step 4), a failed deletion leaves the account fully alive with its clients'
      pending card payments already cancelled, and every retry appends another archive row. This
      inverts BILL-ENT-002's model: the danger is not only silent destruction of billing records, it
      is a hard, permanent, GDPR Art.17-blocking failure with irreversible partial side effects."
    classification:
      domain: "billing"
      category: "broken-invariant"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "owner-authorized targeted audit: BILL-ENT-002 design pass: billing-aware
        account-deletion orchestration"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "87ada6a578ebd16547d45fea667ddfbe443f04e7"
      environment: "repository-only"
      discovery_context: "Produced by an owner-authorized targeted audit scope opened 2026-07-30.
        Read-only inspection; findings returned for supervisor review rather than self-filed."
    location:
      files:
        - "apps/web/supabase/migrations/0106_billing_core.sql"
        - "apps/web/src/lib/server/account-deletion.ts"
        - "apps/web/src/lib/server/billing/tax-snapshot.ts"
        - "apps/web/src/app/(artist)/settings/account/delete-account-section.tsx"
        - "apps/web/src/app/api/mobile/account/route.ts"
    evidence:
      observed_facts:
        - "Local Docker Postgres, inside BEGIN/ROLLBACK: inserting one profile plus one
          transaction_tax_snapshots row, then `delete from profiles where id=...`, produced
          `ERROR:  P0001: transaction_tax_snapshots is append-only; corrections are new rows`, with
          psql CONTEXT naming the cascade statement `DELETE FROM ONLY
          \"public\".\"transaction_tax_snapshots\" WHERE $1 OPERATOR(pg_catalog.=) \"artist_id\"`.
          Transaction rolled back."
        - "POSITIVE CONTROL A (same session, rolled back): an otherwise identical profile carrying
          billing_subscriptions + billing_consent_records rows but NO tax snapshot deleted
          successfully (`DELETE 1`), and the post-delete counts printed `surviving subs=0 surviving
          consents=0`. The trigger, not the FK topology generally, is the specific blocker."
        - "POSITIVE CONTROL B (rolled back): a direct service-role `delete from
          transaction_tax_snapshots ...` also raised P0001. The trigger function has no role gate,
          unlike the two comparable guards (see inspected_comparables_without_issue)."
        - "Production catalog (Management API, read-only): pg_trigger shows `tts_no_mutation` on
          transaction_tax_snapshots, BEFORE, events `DELETE UPDATE`, tgenabled='O' (enabled),
          function tts_block_mutation. pg_constraint shows transaction_tax_snapshots_artist_id_fkey
          with confdeltype='c' (CASCADE) to public.profiles. Local catalog matches exactly
          (tgenabled 'O', confdeltype 'c')."
        - "Source: apps/web/supabase/migrations/0106_billing_core.sql:343-347 defines the function
          as an unconditional `raise exception` and attaches it `before update or delete ... for
          each row`; :304 declares the cascading FK on the same table."
        - "Ordering of irreversible work: apps/web/src/lib/server/account-deletion.ts:139 cancels
          PaymentIntents, :186-197 inserts deleted_account_records, :215-221 deletes profiles. The
          profile delete is last, so steps 2 and 3 have already committed when it aborts."
        - "No uniqueness on the archive:
          apps/web/supabase/migrations/0047_deleted_account_records.sql:23-24 creates only
          `deleted_account_records_artist_idx` (non-unique). Production pg_indexes confirms exactly
          two indexes, the PK on id and that non-unique artist index. Each retry of a failing
          deletion therefore inserts an additional archive row for the same artist."
        - "Error text reaches the user verbatim: account-deletion.ts:220 returns
          `profileError.message`; settings/account/actions.ts:45 returns `{ error: result.message
          }`; delete-account-section.tsx:150 renders `{error}` directly.
          api/mobile/account/route.ts:130 returns `mobileError(500, result.message)`."
      references:
        - "apps/web/supabase/migrations/0106_billing_core.sql"
        - "apps/web/src/lib/server/account-deletion.ts"
        - "apps/web/src/lib/server/billing/tax-snapshot.ts"
        - "apps/web/src/app/(artist)/settings/account/delete-account-section.tsx"
        - "apps/web/src/app/api/mobile/account/route.ts"
      contradictory_evidence: "None recorded by the audit pass."
      inspected_comparables_without_issue:
        - "trips_guest_spot_guard (BEFORE DELETE on trips) and trip_legs_guest_spot_guard (BEFORE
          DELETE OR UPDATE on trip_legs) both sit on tables that CASCADE from profiles, but
          pg_get_functiondef shows both open with `if current_user in ('authenticated','anon')`, so
          they are inert under the service role that runs deletion. Not a blocker."
        - "studio_profiles_detach is BEFORE UPDATE on studio_profiles, whose owner_user_id FK is SET
          NULL (which executes as an UPDATE, so the trigger does fire). Its body only mutates NEW
          and updates map_locations; it never raises. Not a blocker, though it means a deletion
          silently unclaims map locations and suspends studio pages as a side effect."
        - "Production pg_trigger enumeration returned exactly 5 non-internal DELETE/UPDATE triggers
          in the public schema; tts_no_mutation is the only ungated raiser among them. The trigger
          sweep is complete, not a sample."
    assessment:
      interpretation: "Two guarantees were designed independently and collide. 0106's three-layer
        immutability for tax snapshots (service-role RLS, raise-on-mutation trigger, content hash)
        is correct in isolation; 0047's 'the profiles delete is what fans out, and it must succeed'
        is correct in isolation. Postgres executes referential actions as ordinary DML against the
        child table, so the child's own row triggers fire, and an unconditional RAISE in a BEFORE
        DELETE trigger converts a CASCADE into a hard abort of the parent delete. Whoever wrote the
        trigger reasoned about application writes; whoever wrote the FK reasoned about product data.
        The retry loop is the worst part: the operation is non-idempotent in its side effects
        (cancelled intents cannot be un-cancelled, archive rows accumulate) while being永 permanently
        unable to complete."
      root_cause_hypothesis: "HYPOTHESIS (not proven by artefact): 0106 was authored to make the tax
        record tamper-proof against application code and never evaluated against the referential
        graph it simultaneously attached to profiles. The two comparable guards in this database
        (trips, trip_legs) DO gate on `current_user in ('authenticated','anon')`, which is exactly
        the gate that would have made this trigger cascade-safe, so the omission looks like an
        oversight rather than a decision. I found no comment or doc stating an intent either way."
      reachability: "conditionally-reachable"
      impact_status: "latent"
      production_exposure: "Zero today, by data not by design. Production aggregate counts (COUNT(*) only,
        no rows read): transaction_tax_snapshots 0, billing_subscriptions 0,
        account_billing_profiles 0, billing_consent_records 0, billing_contract_confirmations 0,
        withdrawal_cases 0, deleted_account_records 0. tax_policies has 1 current row and
        billing_activation_approvals has 18. The only writer of transaction_tax_snapshots in the
        codebase today is writeWithdrawalCreditNote (tax-snapshot.ts:91), reached from
        withdrawal.ts:14; tax-snapshot.ts:22 states the invoice.paid charge-snapshot writer is a
        separate unbuilt workstream. The activating sequence is therefore ordinary, not exotic:
        consumer subscribes, exercises the 14-day withdrawal, a credit-note snapshot is written, and
        that artist's account can never be deleted again."
      remaining_uncertainty: "The exact user-visible string is a code trace, not an observed capture: I
        did not execute the delete through PostgREST/supabase-js. PostgREST maps P0001 to a JSON
        error whose `message` is the RAISE text, so I rate it high confidence, but it is not
        confirmed. Also unverified: whether Supabase's PostgREST layer wraps or truncates the
        CONTEXT line."
    relationships:
      related_findings:
        - "BILL-ENT-002"
        - "DATA-MIG-002"
        - "TEST-VAC-001"
      analogous_uninspected_areas:
        - "Statement-level or deferred constraint triggers were not enumerated (I filtered on
          row-level DELETE/UPDATE tgtype bits)."
        - "The same collision shape could exist between any future append-only guard and any
          cascading FK. No lint or test exists to catch it."
    remediation:
      status: "open"
      proposed_action: "Not yet actioned. Opened by a targeted audit."
