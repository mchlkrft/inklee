  - id: "WHK-ERR-001"
    title: "17 of 23 Supabase calls in the deposit webhook discard the error, and the handler then
      returns HTTP 200, so Stripe never redelivers and the skipped money work is permanently lost"
    summary: "The file destructures only `data`/`count` from PostgREST responses on 17 call sites,
      including the ones that gate goods fulfilment, refund reconciliation and dispute recording.
      Because PostgREST returns errors in the result object rather than throwing, a transient DB
      failure produces a falsy `data`, which each branch interprets as 'nothing to do', and the
      handler falls through to a 200. Stripe only redelivers on non-2xx, so the work is never
      retried. The single most consequential instance is the goods order flip at route.ts:718: a
      failed UPDATE yields `flipped === undefined`, so the order stays `pending`,
      `decrementInventory` never runs, the customer's itemised confirmation email is never sent, and
      Stripe is told the event was handled — for a card that was already charged."
