    evidence:
      observed_facts:
        - "Commit edb99fb (2026-07-21 18:57) introduces migration 0099 and states the redelivery
          hazard: 'charge.refunded fires once per refund carrying the CUMULATIVE amount_refunded,
          and Stripe redelivers events, so releasing \"proportional to amount_refunded\" on each
          delivery would credit twice for two partial refunds and again on every redelivery.'"
        - "Commit bcb45d5 (2026-07-21 19:21), 24 minutes later: 'The review found two critical
          defects in the release I had just written. Both come from the same root cause: it released
          a share of the intent's sponsored_fee_cents metadata, which records what Inklee INTENDED
          to waive, and treated that as proof the artist's counter had been charged.'"
        - "bcb45d5 names two reachable paths that book nothing: an orphaned payment (artist cancels
          while the card is in flight, paymentIntents.cancel fails, charge succeeds, webhook returns
          early because the booking is already cancelled, settlement increment never runs) and a
          transient increment-RPC failure whose error is captured and dropped. Plus a third: an
          admin resetting usage to zero."
        - "Migration 0100_fee_sponsorship_booked_ledger.sql adds the per-booking stamp of what the
          increment ACTUALLY added; the webhook stamps it only after a successful increment."
        - "bcb45d5 also records a reconcilability defect in 0099's RPC: 'The GREATEST floor could
          absorb part of a release while the audit row recorded it as complete, which made the trail
          unreconcilable and marked a partial release as done.'"
        - "AGENTS.md codifies both rules: 'Never release a fee waiver against intent metadata' and
          'Webhook money operations converge to a target ... Never add a delta; compute the total
          that should have been applied and move only the difference under a row lock.'"
        - "Still cited in current code: apps/web/src/lib/server/order-fee-sync.ts:126-128 'this
          number is evidence of INTENT only: a release is booked against what settlement actually
          recorded, never against intent metadata.'"
      references:
