  - id: "PAY-WHK-001"
    title: "A P9 appointment-payment intent reaching the deposit webhook answers 409, which is a failed
      delivery that would push Stripe toward disabling the endpoint every real deposit settles on"
    summary: "A3 stamps the payment request's subject into the PaymentIntent metadata, so a request
      against an appointment carries `booking_id`, which is the exact key the deposit webhook's
      `payment_intent.succeeded` branch fetches a booking with. Stripe delivers every event of a
      subscribed type to every subscribed endpoint, so that branch would fetch the booking, compare
      the intent amount against `booking_requests.deposit_amount`, find a balance collection is not
      the deposit amount, and return 409. A 409 is a failed delivery: Stripe retries for days and
      counts it toward disabling the endpoint. The blast radius is not the one mispriced payment, it
      is deposits stopping for every artist. The `payment_intent.payment_failed` branch has the
      smaller version: it would write a `deposit_payment_failed` audit row against a booking whose
      deposit did not fail."
    classification:
      domain: "webhook"
      category: "availability"
      severity: "high"
      confidence: "high"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "P9 slice A4 build (settlement half)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "a7cab6c"
      environment: "repository-only"
      discovery_context: "Deciding where appointment-payment settlement should live. Tracing what the
        EXISTING deposit endpoint would do with a payment-request intent was the question that
        settled 'separate endpoint or a branch', and the answer turned out to be a defect rather
        than a design preference."
    location:
      files:
        - "apps/web/src/app/api/stripe/webhook/route.ts"
        - "apps/web/src/lib/server/appointment-payment-intent.ts"
      symbols:
        - "intentMetadata"
        - "isAppointmentPaymentIntent"
      database_objects: []
    evidence:
      observed_facts:
        - "apps/web/src/lib/server/appointment-payment-intent.ts:672-687 `intentMetadata` returns `{
          payment_request_id, artist_id, ...(subject.kind === 'booking' ? { booking_id } : {
          project_id }), ... }`, so a booking-subject payment request DOES carry `booking_id`."
        - "apps/web/src/app/api/stripe/webhook/route.ts (pre-fix) read `intent.metadata?.booking_id`
          at the top of the `payment_intent.succeeded` branch and only skipped when it was ABSENT
          ('A platform-level payment_intent.succeeded with no booking_id is not a deposit'). With it
          present, execution continues to the amount comparison."
        - "The same file's amount check is `if (intent.amount !== expectedAmount)` where
          `expectedAmount` is `booking.deposit_amount * 100`, and it returns HTTP 409. Nothing on
          that path treats a payment-request intent as foreign."
        - "The `payment_intent.payment_failed` branch (pre-fix) inserted an audit_log row with
          `action: 'deposit_payment_failed'` keyed on the same metadata `booking_id`."
      references:
        - "apps/web/src/app/api/stripe/webhook/route.ts"
        - "apps/web/src/lib/server/appointment-payment-intent.ts"
      reproduction: "Deliver a `payment_intent.succeeded` whose metadata carries both `payment_request_id`
        and a `booking_id` for a booking whose `deposit_amount` differs from the intent amount to
        /api/stripe/webhook. NOT executed against a running endpoint: the signature-verified path
        needs a real Stripe delivery, and no route creates such an intent yet. The conclusion is
        traced from the code, which is why confidence is `high` and not `confirmed`."
      contradictory_evidence: "None found. Worth stating what does NOT hit it: `charge.refunded` and
        `charge.dispute.*` on the same endpoint both locate their booking by
        `deposit_payment_intent_id`, which is a POSITIVE match no payment-request intent can
        satisfy, and both already answer 200 on a miss. So the exposure is exactly the two
        `payment_intent.*` branches."
      inspected_comparables_without_issue:
        - "apps/web/src/app/api/stripe/billing-webhook/route.ts already solves the mirror-image
          problem correctly: its `default` branch acknowledges every event type it does not handle
          rather than erroring, and its own comment names the reason."
        - "The deposit endpoint's `payment_intent.succeeded` ALREADY had a skip for the subscription
          case ('invoice PaymentIntents never carry booking_id'), so the class of hazard was
          understood; what was missed is that a P9 intent does carry one."
    assessment:
      interpretation: "A cross-feature coupling that only exists because two features share one Stripe
        account and one metadata key. It is not a bug in either feature read on its own, which is
        why neither slice's review would have found it: A3 is right to stamp the subject, and the
        deposit webhook is right to trust `booking_id`. The defect lives in the space between them,
        and it converts a wrong record for one payment into an availability failure for all
        deposits."
      root_cause_hypothesis: "`booking_id` in PaymentIntent metadata was, until A3, a reliable
        discriminator for 'this is a deposit'. A3 made it ambiguous without anything forcing the
        deposit endpoint to be re-read, because nothing links the two files."
      reachability: "currently-unreachable"
      impact_status: "latent"
      production_exposure: "NONE today. `createPaymentRequestIntentCore` has no caller: the client payment
        page is A6 and no route, action or mobile endpoint invokes it, so no PaymentIntent carrying
        `payment_request_id` has ever existed. It becomes live the moment A6 ships. Not checked
        against production Stripe: no live intent was inspected."
      remaining_uncertainty: "Whether Stripe counts a 409 the same as a 5xx toward endpoint disabling.
        Stripe documents 2xx as success and everything else as a failed delivery, and this
        repository's own deposit webhook comment already reasons that way ('could push Stripe toward
        auto-disabling this endpoint'), but the disabling policy itself was not verified against
        current Stripe documentation in this pass. Also unverified: whether a Charge inherits its
        PaymentIntent's metadata, which is why the new endpoint's refund path answers 'is this ours'
        from our own tables rather than from `charge.metadata`."
    relationships:
      related_findings:
        - "BILL-ENT-002"
      analogous_uninspected_areas:
        - "The Resend email webhook (apps/web/src/app/api/email/webhook/route.ts) was NOT inspected
          for the same shape: an event type it does not recognise returning a non-2xx."
        - "No sweep was done for OTHER metadata keys that two features now share on one Stripe
          account. `artist_id` is on both the deposit intent and the P9 intent; `order_id` is on the
          combined deposit-plus-goods intent. Whether any consumer treats one of those as a
          discriminator was not checked."
        - "The deposit endpoint's `account.updated` and `account.application.deauthorized` branches
          return 500 on a persistence error. Whether that can loop on a permanently failing account
          was not examined."
    remediation:
      status: "fixed-unverified"
      proposed_action: "Both `payment_intent.*` branches now skip an intent carrying `payment_request_id`,
        via `isAppointmentPaymentIntent`, before any booking is read. Appointment payments settle on
        their own endpoint (apps/web/src/app/api/stripe/appointment-webhook/route.ts) with their own
        signing secret."
      fixed_at: "2026-07-30"
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Fixed by the same pass that found it, and NOT verified. No test covers the deposit
        webhook at all (the register's own webhook coverage row records that no test imports it), so
        the guard is held by reading only. The narrow thing a verifier should do is drive both
        branches with a metadata object carrying `payment_request_id` plus a mismatching
        `booking_id` and assert a 200 with no booking read and no audit row."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Cited by path and symbol. No secrets, no production rows, no live Stripe object ids."
    history:
      - date: "2026-07-30"
        actor: "P9 A4 build"
        action: "opened"
        note: "Found while deciding where settlement should live; fixed in the same change because shipping
          A4 without it would arm the defect."
  - id: "PAY-FEE-002"
    title: "The appointment platform fee was computed on the whole frozen basket while the charge was
      the remainder, so a partial collection was charged the fee twice and could exceed the amount"
    summary: "`buildPaymentQuote` derived its two fee bases with `splitFeeBases(lines)` over every
      frozen line, while `amountMinor` was `requestBalance.remainingMinor`. On any request that had
      already collected something those are different numbers, so the appointment fee was charged
      again on value an earlier collection had already paid it on (spec section 6 puts the fee on
      value 'successfully collected'), and where the remainder was smaller than the fee,
      `application_fee_amount` exceeded `amount`, which Stripe rejects outright. A3 recorded it as a
      deliberately-failing `it.fails` tripwire and assigned it to A4 rather than guessing the
      product rule."
    classification:
      domain: "payment"
      category: "money-correctness"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "P9 slice A3 gate (recorded as a tripwire), closed by slice A4"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "3fce7be"
      environment: "local"
      discovery_context: "A3 pinned it as an `it.fails` at the end of block 4 of
        appointment-payment-collection.test.ts, in the one shape that neither asserts a wrong number
        as correct nor loses the finding. It predates this register, so it is entered here on
        closure rather than on discovery."
    location:
      files:
        - "apps/web/src/lib/server/appointment-payment-quote.ts"
        - "apps/web/src/lib/server/__tests__/appointment-payment-collection.test.ts"
        - "packages/shared/src/appointment-payments.ts"
      symbols:
        - "buildPaymentQuote"
        - "splitFeeBases"
        - "apportionCollection"
      database_objects: []
    evidence:
      observed_facts:
        - "EXECUTED 2026-07-30 by reverting the fix and running the test by name: `AssertionError:
          Stripe refuses an application fee above the charge amount: expected 600 to be less than or
          equal to 100`, on a request with 19900 of a 20000 basket already collected."
        - "With the fix in place the same test passes and the base moves with the collection:
          `appointmentBaseMinor` 100 and `applicationFeeMinor` 3."
        - "The pre-fix line was `const bases = splitFeeBases(lines);` immediately above
          `appointmentApplicationFee({ appointmentBaseMinor: bases.appointmentBaseMinor, ... })`,
          while `amountMinor` was assigned `requestBalance.remainingMinor` roughly 60 lines
          earlier."
      references:
        - "apps/web/src/lib/server/appointment-payment-quote.ts"
        - "apps/web/src/lib/server/__tests__/appointment-payment-collection.test.ts"
      reproduction: "Revert the quote's fee-base computation to `splitFeeBases(lines)` and run `vitest run
        src/lib/server/__tests__/appointment-payment-collection.test.ts -t 'the fee is charged on
        the amount being collected'`. It goes red naming 600 against 100."
      contradictory_evidence: "None. Worth recording that the defect could not have been reached in
        production at the time it was found, because `payment_allocations` had no writer until A4:
        `alreadyCollectedMinor` was 0 on every real request, so the frozen basket and the remainder
        were always the same number."
      inspected_comparables_without_issue:
        - "The GOODS lane in the same function had the identical exposure and is fixed by the same
          change, because both bases come out of one `splitFeeBases` call on the apportioned lines."
        - "The deposit path does not share it: its base is the deposit amount, which is the amount
          charged, so there is no second number to disagree with."
    assessment:
      interpretation: "The interesting property is that this was found by DESIGN work rather than by
        observation, exactly like PAY-FEE-001: under the only state the system could reach, the two
        candidate numbers were equal. It became a real defect at the moment A4 gave
        `payment_allocations` a writer, which is why A3 pinned it to A4 rather than to itself."
      root_cause_hypothesis: "The frozen basket is the obvious input to a fee computation and is right for
        the FIRST collection, which is the only one A3 could exercise. The distinction between 'what
        was agreed' and 'what is being taken now' only becomes visible once a request can be
        collected against twice."
      reachability: "currently-unreachable"
      impact_status: "latent"
      production_exposure: "NONE. No allocation row has ever been written in production (A4 is the first
        writer, and it is dark behind an unconfigured webhook endpoint), and no route calls the
        intent core. Established from call-site absence, not from production data."
      remaining_uncertainty: "Whether proportional is the right COMMERCIAL rule for splitting a partial
        collection across lanes, as opposed to the right neutral one. It is a founder-level pricing
        question and it has not been asked; what is settled is that any ordering rule would make the
        fee depend on how many instalments a client paid in."
    relationships:
      related_findings:
        - "PAY-FEE-001"
      structural_patterns:
        - "PAT-002"
      analogous_uninspected_areas:
        - "`resolveOrderFee` (apps/web/src/lib/server/order-fee-sync.ts) prices a re-prepared
          deposit-plus-goods intent from `depositMinor` and a caller-composed `goodsBaseMinor`.
          Whether those can diverge from the amount that intent will actually take was NOT examined
          in this pass."
        - "The subject-scoped balance ceiling in the same quote uses `balanceExtrasFromLines(lines)`
          over the WHOLE frozen basket and was deliberately left alone: it answers a different
          question (what the appointment still owes) rather than what this charge takes. That
          reasoning was not independently reviewed."
    remediation:
      status: "fixed-unverified"
      proposed_action: "`apportionCollection` in packages/shared/src/appointment-payments.ts splits the
        amount being collected across the frozen lines by their share of the frozen total, using
        rounded cumulative totals so the shares sum exactly and a full collection is byte-identical
        to the basket. The quote prices the fee off it and A4's settlement writes its allocation
        rows off the SAME call, so the value the fee is charged on and the value the allocation says
        was bought are one computation."
      fixed_at: "2026-07-30"
    verification:
      status: "not-started"
      independent: false
      residual_risk: "Fixed and graded by the same pass. The arithmetic has a sweep behind it (276,536
        apportionments across five baskets, zero sum/sign/identity failures, with a negative control
        that fails the sum property 14,856 times), but nobody independent has checked that
        proportional is the rule the fee lane should use, nor that no OTHER consumer of
        `splitFeeBases` now receives apportioned lines where it expected frozen ones."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Cited by path, symbol and test name."
    history:
      - date: "2026-07-30"
        actor: "P9 A3 gate"
        action: "opened"
        note: "Recorded on closure: the finding predates this register and existed only as an `it.fails`
          tripwire in the test file."
      - date: "2026-07-30"
        actor: "P9 A4 build"
        action: "fix-committed"
        note: "Fixed. The tripwire is now a passing test with its history kept verbatim, and its red state
          was re-executed before the change to confirm it still discriminates."
  - id: "DATA-MIG-003"
    title: "Two migrations state that Supabase default privileges grant service_role EXECUTE; measured,
      the privilege comes from PUBLIC, so `revoke ... from public` silently removes it in
      production"
    summary: "Migrations 0124 and 0126 both explain their grant posture with 'Supabase's default
      privileges grant it and supabase/seed.sql re-grants execute on all routines to service_role',
      which is true in effect and wrong about the mechanism. A freshly created function in `public`
      has `proacl = NULL`, the POSTGRES default of EXECUTE TO PUBLIC, and service_role reaches it
      only as a member of PUBLIC. There is no Supabase default privilege naming service_role. So
      `revoke execute ... from public` removes the only path service_role had, and seed.sql (LOCAL
      ONLY) hides that. Neither 0124 nor 0126 has the live version, because both grant
      `authenticated` explicitly and are called by an artist; a function whose only caller is the
      service role has no such accident to save it."
    classification:
      domain: "migration"
      category: "incorrect-documentation"
      severity: "medium"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "P9 slice A4 build (settlement half)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "a7cab6c"
      environment: "local"
      discovery_context: "Slice A4 copied 0126's grant posture into a new RPC whose ONLY caller is the
        service role. The comment said the revoke was safe; a behavioural probe of the RPC came back
        'permission denied'. The comment is what made the mistake look correct."
    location:
      files:
        - "apps/web/supabase/migrations/0124_delete_collection_atomic.sql"
        - "apps/web/supabase/migrations/0126_payment_request_send.sql"
        - "apps/web/supabase/seed.sql"
      database_objects:
        - "send_payment_request"
        - "delete_collection_atomic"
        - "converge_payment_refund"
    evidence:
      observed_facts:
        - "Probe function with no grants at all, created in `public` via psql: `proacl` is NULL, and
          `has_function_privilege` reports `svc=true anon=true`. So the default is Postgres's
          EXECUTE TO PUBLIC and it covers service_role and anon equally."
        - "apps/web/supabase/seed.sql:25 is `GRANT EXECUTE ON ALL ROUTINES IN SCHEMA public TO
          service_role;`, and seed.sql runs only on a local `supabase db reset`."
        - "After re-running a migration by hand WITHOUT seed.sql, the new function's ACL was
          `{postgres=X/postgres}` and `has_function_privilege('service_role', ..., 'EXECUTE')` was
          false. A service-role client calling it received 'permission denied for function
          converge_payment_refund'."
        - "By contrast `send_payment_request` on the same database carries
          `{postgres=X/postgres,authenticated=X/postgres,service_role=X/postgres}`, and the
          service_role entry is seed.sql's, not the migration's: 0126 grants only `authenticated`."
        - "0126's own text: 'service_role KEEPS EXECUTE, and the honest reason is that it cannot be
          taken away here: Supabase's default privileges grant it'. 0124 carries the same claim."
      references:
        - "apps/web/supabase/migrations/0126_payment_request_send.sql"
        - "apps/web/supabase/seed.sql"
      reproduction: "In the local stack: `create function f() ...` via psql, read `proacl` (NULL) and
        `has_function_privilege('service_role', 'public.f()', 'EXECUTE')` (true). Then `revoke
        execute on function f() from public;` and read it again (false). No seed.sql in between."
      contradictory_evidence: "CONTRADICTED IN PRODUCTION, added by the supervisor 2026-07-30 by read-only
        Management API query. The finding was established against the LOCAL stack, where
        service_role only holds EXECUTE because seed.sql grants it. Production disagrees:
        pg_proc.proacl for delete_collection_if_eligible (0124, live) is {postgres=X/postgres,
        authenticated=X/postgres, service_role=X/postgres} and has_function_privilege(service_role)
        is TRUE, despite 0124 granting only to authenticated. So the hosted project DOES carry a
        default privilege naming service_role that the local stack does not reproduce. The finding
        stands for LOCAL behaviour and for portability of the idiom; its stronger reading, that a
        revoke leaves service_role unable to execute, is FALSE in production for this function."
      inspected_comparables_without_issue:
        - "0125's `revoke insert, update, delete, truncate on payment_allocations from anon,
          authenticated` is a TABLE grant and does not touch PUBLIC, so it is unaffected. Table
          privileges in this schema come from seed.sql and from Supabase's real default privileges
          on tables, which do name the three roles."
    assessment:
      interpretation: "An instance of PAT-001 in its purest form: a comment asserting a privilege
        mechanism nobody had executed, which then told the next author not to look. The cost landed
        one migration later and would have shipped a dead money path to production, where seed.sql
        does not run and the failure is permanent rather than a local annoyance."
      root_cause_hypothesis: "Somebody read `has_function_privilege('service_role', ...) = true` after a
        local `db reset` and concluded the privilege was a Supabase default. It was seed.sql's. The
        two are indistinguishable from that single measurement, which is why the claim survived."
      reachability: "conditionally-reachable"
      impact_status: "theoretical"
      production_exposure: "None from 0124 or 0126: their callers hold an explicit grant. Production was
        NOT inspected; the ACL evidence is from the local stack, and the production claim rests on
        seed.sql not being part of `supabase db push`, which is documented behaviour rather than
        something measured here."
      remaining_uncertainty: "Whether Supabase's hosted projects install an ALTER DEFAULT PRIVILEGES rule
        for FUNCTIONS that the local image does not. The local image demonstrably has none;
        production was not read. If it did, 0128's explicit grant would be redundant rather than
        load-bearing, which is a harmless outcome either way. | Where production's service_role
        grant originates was not established: ALTER DEFAULT PRIVILEGES on the hosted project is the
        likely source but was not read. Whether that default applies to FUTURE functions, or only to
        those created before some point, is unknown and matters for 0128."
    relationships:
      related_findings:
        - "DATA-MIG-001"
        - "DATA-MIG-002"
      structural_patterns:
        - "PAT-001"
      analogous_uninspected_areas:
        - "Every other `revoke execute ... from public` in the migration set was NOT enumerated. Any
          function whose only caller is the service role and which revokes from PUBLIC without an
          explicit service_role grant has the live version of this defect."
        - "The same question for SEQUENCES and for `revoke ... from public` on tables was not asked."
