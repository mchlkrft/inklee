  - id: "CRON-TOK-001"
    title: "Reconfirmation rotates the customer's magic-link token before sending the email, so a crash
      between the two permanently locks the customer out"
    summary: "The handler writes a new customer_token_hash, then sends the email carrying the new token,
      then restores the old hash if the send throws. A process kill (timeout, OOM, deploy) between
      the update and the send leaves the customer's existing link dead with no replacement
      delivered, and the compensating restore's own error is unchecked."
