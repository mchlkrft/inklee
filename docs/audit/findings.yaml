  - id: "DATA-MIG-001"
    title: "`migration repair --status applied` on 2026-04-20 marked 0001_rls_policies.sql applied
      without running it, leaving 6 core tables with RLS disabled in production for ~3 weeks"
    summary: "Migration bookkeeping was normalized with `supabase migration repair ... --status
      applied`, which updates the ledger without executing SQL. 0001 and 0002 therefore never
      reached production. Supabase's Security Advisor flagged profiles, booking_requests,
      booking_images, slots, email_templates and audit_log as 'RLS Disabled in Public' on 2026-05-06
      and the gap was closed on 2026-05-10 by migrations 0026-0028, applied via the SQL editor."
    classification:
      domain: "migration"
      category: "schema-drift"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-05-06"
      detected_by: "repository backfill from committed evidence (2026-07-30)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "31f320c"
      environment: "repository-only"
      discovery_context: "Backfilled during the initial build of this register. Evidence was read from
        committed code, migrations, review artifacts and commit messages already in the repository;
        it was not reconstructed from conversational memory."
    location:
      files:
        - "apps/web/supabase/migrations/0026_restore_rls_policies.sql"
        - "apps/web/supabase/migrations/0027_public_select_policies.sql"
        - "apps/web/supabase/migrations/0028_public_slot_lock.sql"
        - "apps/web/supabase/migrations/0029_drop_unused_anon_policies.sql"
        - "apps/web/supabase/migrations/0030_lock_down_public_table_access.sql"
        - "apps/web/supabase/migrations/0031_drop_remaining_public_select.sql"
        - "AGENTS.md"
      database_objects:
        - "profiles"
        - "booking_requests"
        - "booking_images"
        - "slots"
        - "email_templates"
        - "audit_log"
    evidence:
      observed_facts:
        - "apps/web/supabase/migrations/0026_restore_rls_policies.sql:1-16 states the six flagged
          tables by name and the cause: 'on 2026-04-20 the migration history was normalized with
          `supabase migration repair ... --status applied`, which marks migrations as applied
          WITHOUT executing their SQL.'"
        - "Commit 31f320c (2026-05-10 19:47) is the fix and gives the timeline: Advisor flagged
          2026-05-06; three migrations applied via SQL editor 2026-05-10."
        - "Commit 99cb4bc (2026-05-10 19:48) adds the AGENTS.md guardrail with concrete verification
          queries (pg_policies, information_schema, pg_tables)."
        - "0027 discloses a second defect surfaced by the repair: 0001 'forgot' the anon SELECT
          policies, so inklee.app/{slug} 404'd for anonymous visitors once RLS was actually on."
        - "0028 added a transient anon UPDATE policy on slots during debugging; dropped again in
          0029 (f2cf9ab) once the real cause was found (f467ac6)."
        - "f2cf9ab records a further finding in the same sweep: 0001's 'service role can insert
          booking images' policy was mis-targeted at `authenticated` with `WITH CHECK (true)` — any
          authenticated user could insert any row — and `public_insert_waitlist` was `WITH CHECK
          (true)` with no role restriction."
        - "Two days later 339bb72 (2026-05-12) found the restored RLS was itself insufficient: 'RLS
          can hide rows but not columns, so every selectable row exposed every column to anonymous
          REST', naming enumeration leaks on 9 tables. Fixed by 0030/0031 plus routing public reads
          to serviceClient."
      references:
        - "apps/web/supabase/migrations/0026_restore_rls_policies.sql"
        - "apps/web/supabase/migrations/0027_public_select_policies.sql"
        - "apps/web/supabase/migrations/0028_public_slot_lock.sql"
        - "apps/web/supabase/migrations/0029_drop_unused_anon_policies.sql"
        - "apps/web/supabase/migrations/0030_lock_down_public_table_access.sql"
        - "apps/web/supabase/migrations/0031_drop_remaining_public_select.sql"
      contradictory_evidence: "31f320c's mitigating claim ('Pre-existing application-layer ownership
        checks (Slice 33) were unaffected — RLS was second line of defense, not the only line') is
        undercut by 339bb72 two days later, which found anonymous column-level enumeration on 9
        tables and had to move public reads to serviceClient. Application-layer checks did not cover
        anonymous REST."
      inspected_comparables_without_issue:
        - "0026's restoration pattern is convergent: DROP POLICY IF EXISTS then CREATE POLICY, plus
          a naturally idempotent ENABLE ROW LEVEL SECURITY (0026:19-38 and throughout). This is the
          house repair pattern AGENTS.md later endorses."
    assessment:
      interpretation: "The incident has two layers that are easy to conflate. Layer 1 is the repair
        masking unrun SQL. Layer 2, found two days later, is that even correctly-applied row-level
        policies did not close the exposure, because RLS filters rows and not columns. AGENTS.md
        records only layer 1, which understates what the incident taught."
      root_cause_hypothesis: "`migration repair --status applied` is a bookkeeping-only operation whose
        name and success output are indistinguishable from having applied the SQL. It was reached
        for to reconcile a divergent ledger without first verifying the migration's effects
        existed."
      reachability: "directly-reachable"
      impact_status: "historically-impacting"
      production_exposure: "PARTIALLY ESTABLISHED, and the repo cannot close it. 31f320c asserts 'No prod
        data exposed in the gap window: per project_inklee_roadmap.md, no real artists onboarded yet
        — only test/admin accounts.' That file DOES NOT EXIST in this repository — grep finds only
        references (docs/roadmap.md:128 calls it 'memory project_inklee_roadmap.md';
        SLICES_CONTINUATION.md:1287/1306/1554; docs/business-model.md:366). The exposure assessment
        rests on an out-of-repo document and is NOT citable here."
      remaining_uncertainty: "The gap window's real exposure. Also whether RLS was off for longer than
        2026-04-20 to 2026-05-10 (i.e. whether it was ever on before the repair) is not established
        in the repo."
    relationships:
      analogous_uninspected_areas:
        - "Commit edb99fb (2026-07-21) records that 0095-0098 ALSO had to be repaired into the
          ledger because 'they had been applied by another session via direct SQL and were
          unrecorded' — a second, later ledger/reality divergence, in the safe direction. Whether
          other silent divergences exist was NOT checked against a live catalog."
        - "Whether any of the six tables retained rows written during the gap window was not
          checked."
    remediation:
      status: "fixed-unverified"
      fix_commit: "31f320c"
      proposed_action: "Fix landed in 31f320c (0026-0028), f2cf9ab (0029), 339bb72 (0030-0031)."
      fixed_at: "2026-05-06"
    verification:
      status: "not-started"
      independent: false
      residual_risk: "A fix is committed but nothing independent has confirmed it."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Evidence is cited by path, symbol and commit rather than reproduced. No
        secrets, personal data, production rows or runnable exploit steps."
    history:
      - date: "2026-05-06"
        actor: "original discovery (see discovery.commit)"
        action: "opened"
        note: "Recorded retrospectively; the original discovery predates this register."
      - date: "2026-07-30"
        actor: "audit-register backfill"
        action: "backfilled"
        note: "Entered from evidence already committed to the repository."
  - id: "DATA-MIG-002"
    title: "68 `create table if not exists` blocks declare constraints inline, so the documented
      non-convergence footgun is systemic — and the 0122 remediation that produced the footgun entry
      is itself partial"
    summary: "AGENTS.md documents that anything declared inline in a `create table if not exists` column
      list is skipped once the table exists, so re-running exits 0 having restored nothing. A
      repo-wide scan finds 68 such blocks across ~45 migrations carrying inline FK, UNIQUE and CHECK
      constraints. Only 0125 was fully remediated to guarded blocks. 0122 — the file the footgun was
      discovered in — was remediated for two composite FKs but still declares an FK and a UNIQUE
      constraint inline on the same table."
    classification:
      domain: "migration"
      category: "schema-drift"
      severity: "medium"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-29"
      detected_by: "repository backfill from committed evidence (2026-07-30)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "201fbfc"
      environment: "repository-only"
      discovery_context: "Backfilled during the initial build of this register. Evidence was read from
        committed code, migrations, review artifacts and commit messages already in the repository;
        it was not reconstructed from conversational memory."
    location:
      files:
        - "apps/web/supabase/migrations/0122_collection_items.sql"
        - "apps/web/supabase/migrations/0125_appointment_payments.sql"
        - "apps/web/supabase/migrations/0106_billing_core.sql"
        - "apps/web/supabase/migrations/0118_goods_discounts.sql"
        - "AGENTS.md"
      database_objects:
        - "product_collection_items"
        - "and 67 other tables created via `create table if not exists` with inline constraints"
    evidence:
      observed_facts:
        - "Repo-wide scan of apps/web/supabase/migrations/0*.sql run this session (comment lines
          stripped): 68 `create table if not exists` blocks contain at least one inline
          `references`, `unique` or `check`. Examples with line numbers:
          0106_billing_core.sql:121/187/208/235/253/300/352/372/395, 0118_goods_discounts.sql:15/57,
          0115_large_projects.sql:23/92, 0080_guest_spot_requests.sql:18/66/94/128/153,
          0088_country_coverage.sql:15/33/74/113/151."
        - "0122_collection_items.sql:55 opens `create table if not exists product_collection_items
          (` and STILL declares two objects inline: :70 `artist_id uuid not null references
          profiles(id) on delete cascade` and :77 `constraint product_collection_items_unique unique
          (collection_id, product_id)`."
        - "0122:83-93 is a comment explaining that inline declaration is non-convergent and that the
          two composite FKs were therefore moved to guarded `do $$` blocks (:94-112). It is correct
          about the two FKs and silent about the two objects still inline four lines above it."
        - "0122:75-76 states the inline UNIQUE constraint is load-bearing: 'A product appears at
          most once in a given collection. This also makes the backfill and the legacy-mirror
          trigger below idempotent for free.' If dropped, re-running 0122 would not restore it."
        - "Commit 201fbfc (2026-07-29) is explicit about its own scope: 'both composite foreign keys
          move out of the inline `create table if not exists`', proven by drop-and-rerun with
          pg_constraint confirmation. It claims convergence only for those two."
        - "AGENTS.md quotes the empirical output: `NOTICE: relation \"product_collection_items\"
          already exists, skipping / CREATE TABLE`."
        - "0125_appointment_payments.sql is the only file scanned with NO inline constraints: its
          tables (payment_requests:277, payment_request_lines:647, payment_collections:964) declare
