  - area: "Mobile JSON API routes and web server actions: authentication, ownership scoping, input
      validation, error handling, IDOR and cache revalidation"
    subsystem: "authz"
    coverage: "substantial"
    review_type: "adversarial-verification"
    last_inspected: "2026-07-30"
    commit_inspected: "9f55ab7"
    reviewer: "owner-authorized targeted audit, an instance that authored none of the code under review"
    evidence: "SCOPE AS ASSIGNED, all read in full: 17 mobile route files (booking-form + fields +
      fields/[id] + confirmation, goods + [id] + [id]/status + collections + discounts, projects +
      [id], settings/appearance + email-templates + hub + slug, travel/studios + travel/trips) and
      18 server-action files ((artist) bookings/booking-form, bookings/form, bookings/books,
      bookings/projects, bookings/settings, goods, goods/collections, goods/discounts,
      settings/appearance, settings/books, settings/plan, settings/profile/slug-actions, studio;
      plus [slug], [slug]/project, request/[token], legal/report, (map)/map). Because most actions
      are thin wrappers, the shared cores they delegate to were read too and are the substantive
      part of the coverage: lib/server/mobile-auth.ts, collections.ts, discount-write.ts,
      projects.ts, goods-variants.ts, slug-rename.ts, appearance-write.ts, confirmation-write.ts,
      map-watch.ts, plus lib/ratelimit.ts, lib/image-guard.ts, lib/image-processing.ts and
      lib/mobile-goods.ts.

      LIMB 1, AUTHENTICATION — CLEAN, no exceptions. All 17 mobile routes begin with
      `requireMobileUser(req)` and return before touching data on failure. All 18 action files
      resolve the user through the cookie client and refuse when absent. requireMobileUser itself
      (mobile-auth.ts:28-75) validates the bearer token via supabase.auth.getUser, builds an
      RLS-SCOPED anon-key client rather than a service client, and adds a suspension gate that
      deliberately fails OPEN on a missing profile with the reasoning stated in the file. The one
      unauthenticated action in scope, submitProjectIntakeAction, is unauthenticated by design (it
      is a public intake) and is covered by ABUSE-PUB-001 for what it lacks INSTEAD of auth, not for
      lacking auth.

      LIMB 2, OWNERSHIP AND IDOR — CLEAN. I looked specifically for an id taken from the URL or body
      and used without an owner predicate, and did not find one in the assigned scope. Every write
      carries `.eq(\"artist_id\", userId)` (or `.eq(\"id\", userId)` on profiles) in the same
      statement, not in a preceding read. The service-role uses are the interesting cases and each
      one was traced: projects.ts runs service-role because RLS 0115 gives the artist SELECT only,
      and every one of loadProject / setProjectStatusCore / saveProjectNoteCore /
      linkBookingToProjectCore carries `.eq(\"artist_id\", artistId)` with a rowcount check;
      booking-form/fields/[id] DELETE uses the service client solely to COUNT booking_requests, and
      scopes that count to the artist; goods-variants.ts reconcileVariants runs service-role but
      scopes every update and delete to `.eq(\"product_id\", productId)` after the caller has
      ownership-checked the product with an RLS read. Three positive defences worth recording
      because they are easy to get wrong and are right here: goods/actions.ts:326-327 refuses a
      keep-list image URL that is not already on the product, which blocks a cross-artist graft or
      delete; travel/studios POST deliberately does not accept the Google Places columns from the
      body so a crafted request cannot inject a google_maps_url onto a public block; and
      request/[token] prepareCheckoutAction allowlists every add-on against the artist-confirmed
      booking_interests rows and caps quantity at what the artist vouched for.

      LIMB 3, INPUT VALIDATION — sound, with the shape stated. No route uses `await request.json()`
      output directly in a query. Bodies go through a named validator (normalizeProductInput,
      normalizeStudioInput, normalizeTripInput, normalizeFieldInput + the shared zod
      fieldConfigSchema, parseBioPageSettings, parseAppearance, parseConfirmationPage) or through a
      core that validates. Where coercion is lenient it is deliberate and commented (unrecognised
      category/status/currency fall back to a safe default, matching the web action). Two
      fail-closed choices were checked and hold: mobile-goods.ts:103 publishes only on an explicit
      boolean true, and settings/hub POST refuses a non-object body rather than letting the parser
      treat it as DEFAULT_BIO_PAGE and wipe the config. UUID_RE guards the path parameter on
      projects/[id] and booking-form/fields/[id].

      LIMB 4, ERROR HANDLING — one finding, OPS-ERR-001. Every route wraps req.json() in try/catch
      and returns a fixed 400.

      LIMB 5, ERROR-HANDLING CONSISTENCY — the sibling comparison found real but minor divergence,
      recorded here rather than as a finding because nothing is unsafe: goods/[id] PUT and
      goods/[id]/status PATCH both do an explicit existence read and return a structured 404, while
      booking-form/fields/[id] PATCH does not, so a PATCH naming a non-existent or foreign field id
      matches zero rows, produces no error and returns 200 {ok:true}. The DELETE verb in that same
      file DOES return 404. Similarly, mobile goods/discounts PATCH maps every setDiscountActiveCore
      failure to 500, including the \"That code no longer exists.\" case which is a 404. Neither
      leaks data or permits a write.

      LIMB 6, REVALIDATION — one finding, BILL-UI-001, and it is the only mutation in the audited
      set without one. Counted the other way: 8 collections actions, 2 discounts, 7 goods, 18
      studio, 5 bookings/settings, books, appearance, slug (layout-wide), projects, map, and the
      mobile hub route (which revalidates the PUBLIC /<slug>/hub) all revalidate."
    changed_since_inspection: "no"
    findings_produced:
