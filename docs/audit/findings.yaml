        - "Each iteration sends TWO emails: sendDepositOverdueCustomer (:165) and
          sendDepositOverdueArtist (:176)."
        - "PROD (read-only Management API, 2026-07-30): audit_log action='reminder_sent' grouped by
          details->>'type' = deposit_overdue 275 rows / 10 distinct bookings / max 46 rows for a
          single booking; appointment_reminder 4; reconfirmation 1."
        - "PROD: exactly 1 booking is currently deposit_pending with customer_email set and
