  - area: "Appointment payment settlement (P9 slice A4): convergence, idempotency and event ordering"
    subsystem: "money"
    coverage: "substantial"
    review_type: "adversarial-verification"
    last_inspected: "2026-07-30"
    commit_inspected: "9f55ab73ae1de1366a4660dd5614e030daec0bdf"
    reviewer: "independent falsification verifier, not the author of A4 and not the author of A4's test pass"
    evidence: "A third pass over the same code, deliberately not re-running the author's or the tester's
      scenarios. Read in full: 0128_payment_settlement.sql, appointment-payment-settlement.ts,
      api/stripe/appointment-webhook/route.ts, the transition table, PAYABLE set,
      apportionCollection and checkAllocation in packages/shared, and the constraint and trigger
      sections of 0125 and 0127. Then twelve probes with MY OWN fixtures, driven against the local
      stack through the real service client, the real RPC and (for the HTTP question) the real route
      with real HMAC verification. Both probe files were deleted after the run; nothing was left in
      the repository. WHAT HELD UP, each executed. (1) NOTHING ADDS A DELTA. Every write to
      payment_allocations was enumerated by grep: exactly two, the settle path's fresh one-statement
      insert and 0128's `on conflict on constraint payment_allocations_unique do update set
      amount_minor = excluded.amount_minor`. The sequence 3000, 5000, 3000-out-of-order, 5000, 5000
      produced converged/converged/stale/unchanged/unchanged with exactly ONE refund_adjustment row
      throughout and a final -5000. (2) REDELIVERY CANNOT DOUBLE-ALLOCATE. The same succeeded event
      five times (three sequential, then two concurrent from two backends) left 2 rows with the SAME
      row ids as the first delivery and a sum of 10000; a pair of concurrent FIRST deliveries
      produced settled + already_settled and 1 row, with neither call failing. (3) THE CONVERGE IS
      GENUINELY UNDER A ROW LOCK. With a newer event holding the payment_collections row in an open
      transaction, the older call BLOCKED (pg_blocking_pids count 1, 1231ms) and answered `stale`
      after re-reading; the stored total stayed at the newer 7000. The lock-first /
      re-check-in-a-later-statement shape of 0124 and 0125 is correctly implemented here. (4) THE
      UNKNOWN-INTENT PATH DOES NOT 500. Over real HTTP: a charge.refunded for an intent no payment
      request has ever claimed answered 200 `not_ours`; a claimed-but-unsettled intent answered 500
      while the event was young and 200 once it aged past the one-hour bound. That is the correct
      shape for BILL-ENT-002. (5) ALLOCATION INTEGRITY HOLDS. A partial 3333 of a 11000 basket
      containing a discount line allocated to full_price=3030, discount=-454, physical_goods=757,
      summing exactly to 3333, with checkAllocation running BEFORE the insert; a second collection
      on the same request moved partially_paid then paid correctly. Reasoned, not just executed: a
      component cannot silently go missing, because one row is emitted per frozen line and
      checkAllocation refuses the set unless the gross components sum to what Stripe collected. (6)
      THE BACKWARD-WALK GUARD ON THE SETTLE PATH HOLDS. With the request at `refunded` and at
      `partially_refunded`, a redelivered succeeded returned already_settled / statusMovedTo null
      and changed nothing."
