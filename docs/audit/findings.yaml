  - id: "CRON-IGX-001"
    title: "instagram-refresh marks an account disconnected on ANY thrown error, including a transient
      Meta outage"
    summary: "The catch block treats every failure of refreshLongLivedToken as a dead token and writes
      connected=false. refreshLongLivedToken throws on any non-2xx (including 429/5xx) and fetch
      throws on network failure, so a Meta incident disconnects every account due for refresh at
      once."
    classification:
      domain: "jobs"
      category: "silent-failure"
      severity: "medium"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "owner-authorized targeted audit: Cron endpoints (apps/web/src/app/api/cron/*) - all
        eight reviewed indi"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "87ada6a578ebd16547d45fea667ddfbe443f04e7"
      environment: "repository-only"
      discovery_context: "Produced by an owner-authorized targeted audit scope opened 2026-07-30.
        Read-only inspection; findings returned for supervisor review rather than self-filed."
    location:
      files:
        - "apps/web/src/app/api/cron/instagram-refresh/route.ts"
        - "apps/web/src/lib/instagram.ts"
    evidence:
      observed_facts:
        - "apps/web/src/app/api/cron/instagram-refresh/route.ts:53-65 - catch(err) then
          update({connected:false}) for the account, with the comment at :58 asserting 'Token is
          dead'."
        - "apps/web/src/lib/instagram.ts:172-175 - refreshLongLivedToken throws `Token refresh
          failed: ${err}` for ANY res.ok === false; a bare fetch() also rejects on DNS/TLS/socket
          failure, and there is no timeout or retry."
        - "No error class, no HTTP status check, no per-account attribution of the failure before
          the write."
        - "PROD: instagram_accounts has 1 connected and 0 disconnected rows, so the current blast
          radius is 1 account."
      references:
        - "apps/web/src/app/api/cron/instagram-refresh/route.ts"
        - "apps/web/src/lib/instagram.ts"
      contradictory_evidence: "None recorded by the audit pass."
      inspected_comparables_without_issue:
        - "The successful-refresh path stores the new token before counting success
          (route.ts:43-52), so a refresh is not double-counted."
    assessment:
      interpretation: "This is the same defect shape as PAY-CONN-001 (cached Connect state lying / every
        403 mapping to one error class): a broad catch is narrowed by a comment rather than by a
        check, and a platform-wide upstream fault is treated as a per-account fact. The comment at
        :58 is an instance of PAT-001."
      root_cause_hypothesis: "The 'mark disconnected so the artist sees they need to reconnect' UX
        requirement was implemented at the only place an error was visible, without distinguishing a
        token-invalid response (400 with an OAuthException subcode) from an availability failure."
      reachability: "directly-reachable"
      impact_status: "latent"
      production_exposure: "Fires on the next 04:00 UTC tick for any connected account within 7 days of
        token expiry if Meta returns non-2xx. Today that is at most 1 account. Recovery requires the
        artist to re-run the OAuth flow; the cron cannot undo it because the row no longer matches
        connected=true (route.ts:21)."
      remaining_uncertainty: "I did not confirm which HTTP status Meta returns for an expired
        ig_refresh_token versus a rate limit, so I cannot state the exact discriminator a fix should
        use. I also did not check whether the artist is notified of the forced disconnect."
    relationships:
      related_findings:
