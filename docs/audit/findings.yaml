          and an over-max image count (:332)."
        - "The UPDATE path in the same file handles this correctly on both branches: :582-585 and
          :586-590 each call removeOwnedGoodsObjects(uploaded, ...) before returning."
        - "apps/web/src/lib/server/projects.ts:169-212 is the same insert-then-upload sequence with
          an explicit rollback closure that removes the uploaded objects AND deletes the project
