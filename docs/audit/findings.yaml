register_version: 1
notes: "Continuous Audit Evidence and Structural Risk Register. THE ONLY HAND-EDITED SOURCE in
  docs/audit/; the four .md reports are generated from it by `pnpm audit:generate`. This repository
  is PUBLIC: no secrets, personal data, production rows or runnable exploit steps. Read
  docs/audit/README.md before adding an entry. Absence of a finding is NOT evidence of safety, and
  coverage 'none' means not inspected."
findings:
  - id: "AUTH-RLS-001"
    title: "product_collections shipped RLS-enabled with a SELECT-only policy while every write runs on
      the user-scoped client"
    summary: "Migration 0120 created product_collections, enabled RLS, and created exactly one policy
      (SELECT). All collection writes go through
      apps/web/src/app/(artist)/goods/collections/actions.ts, which resolves its client via
      createClient() (the user-scoped server client), so every INSERT/UPDATE/DELETE was rejected by
      RLS. The feature was merged to master and 0120 applied to production in that state. Repaired
      forward-only by 0121."
    classification:
      domain: "authorization"
      category: "missing-authorization"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-29"
      detected_by: "repository backfill from committed evidence (2026-07-30)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "805358d"
      environment: "repository-only"
      discovery_context: "Backfilled during the initial build of this register. Evidence was read from
        committed code, migrations, review artifacts and commit messages already in the repository;
        it was not reconstructed from conversational memory."
    location:
      files:
        - "apps/web/supabase/migrations/0120_product_collections.sql"
        - "apps/web/supabase/migrations/0121_product_collections_write_policies.sql"
        - "apps/web/src/app/(artist)/goods/collections/actions.ts"
        - "apps/web/tests/db/collections-rls.test.ts"
      database_objects:
        - "product_collections"
    evidence:
      observed_facts:
        - "apps/web/supabase/migrations/0120_product_collections.sql:27 `alter table
          product_collections enable row level security;` and :29-30 the only policy in the file,
          `create policy \"artist reads own collections\" ... for select using (artist_id =
          auth.uid());` — no INSERT/UPDATE/DELETE policy."
        - "apps/web/src/app/(artist)/goods/collections/actions.ts:4 imports `createClient` from
          `@/lib/supabase/server`; :19 `const supabase = await createClient();` — the user-scoped
          client, not serviceClient."
        - "apps/web/supabase/migrations/0121_product_collections_write_policies.sql:43-56 adds three
          policies (`for insert to authenticated`, `for update to authenticated`, `for delete to
          authenticated`) with USING/WITH CHECK on artist_id = auth.uid()."
        - "Commit 805358d (2026-07-29) records the observed production error text: `AUTHENTICATED
          INSERT -> new row violates row-level security policy for table \"product_collections\"`,
          and that '0120 is already in production'."
        - "Same commit records the red/green proof: 'Verified by dropping the three policies and
          re-running: 9 of 10 fail. Restored: 10 of 10 pass.'"
        - "Root cause in the author's own words (805358d): 'I copied the sibling policy shape
          without checking which client does the writing.'"
      references:
        - "apps/web/supabase/migrations/0120_product_collections.sql"
        - "apps/web/supabase/migrations/0121_product_collections_write_policies.sql"
        - "apps/web/src/app/(artist)/goods/collections/actions.ts"
        - "apps/web/tests/db/collections-rls.test.ts"
      contradictory_evidence: "None found. 0121's own header comment originally cited discount_codes as a
        healthy precedent, which was FALSE; that claim is retracted in place per house style rather
        than deleted."
      inspected_comparables_without_issue:
        - "apps/web/src/lib/server/discounts.ts:157 writes discount_redemptions via `serviceClient`,
          so 0118's SELECT-only policy on that table is correct (inspected, no issue)."
        - "f090956 records that `projects` was checked: 'verified: every projects write goes through
          serviceClient'."
    assessment:
      interpretation: "The failure is not 'someone forgot a policy'. It is that the repo had no gate class
        capable of observing the permission model: every P5d test exercised
        `groupProductsByCollection`, a pure function, so typecheck, unit, e2e, lint and a production
        build were all green against an unusable feature."
      root_cause_hypothesis: "The author selected a policy shape by pattern-matching sibling tables
        (projects, discount_codes) rather than asking which Supabase client performs the writes.
        `projects` is legitimately SELECT-only because its writes go through serviceClient after an
        explicit ownership check; collections carry no such rule and write on the artist's own
        client."
      reachability: "directly-reachable"
      impact_status: "historically-impacting"
      production_exposure: "0120 was applied to production. Per 805358d the feature was 'pushed to master
        and its migration applied to production unable to insert a single row'. No production row
        count for product_collections is cited anywhere in the repo, so the number of artists who
        hit it is not established."
      remaining_uncertainty: "Whether any real artist attempted a collection write while 0120 was live and
        unrepaired. No production telemetry or row count is cited in the repo."
    relationships:
      analogous_uninspected_areas:
        - "Every other table created since 0035 with `enable row level security` — I did not
          enumerate policy-vs-writing-client across the full table set."
        - "0118's SELECT policies carry no `TO` clause so they bind PUBLIC including anon; whether
          anon holds a table-level GRANT was NOT checked against a live catalog."
      structural_patterns:
        - "PAT-001"
      related_findings:
        - "AUTH-RLS-002"
    remediation:
      status: "verified"
      fix_commit: "805358d"
      proposed_action: "Fix landed in 0121 in 805358d, hardened (TO authenticated) in f090956."
      fixed_at: "2026-07-29"
    verification:
      status: "passed"
      independent: true
      verified_by: "independent reviewer or verifier role, separate from the author"
      verified_at: "2026-07-29"
      verification_commit: "805358d"
      verification_method: "YES, and independent verification changed the outcome. A separate database/RLS
        specialist reviewer produced docs/product/p5d-gate-a-specialist-review.md (2026-07-29),
        verdict CHANGES REQUIRED: 0121's SQL was correct, but the evidence artifact meant to prove
        it never executed (finding A1: `pnpm test:db` exited 0 with all ten tests skipped). A second
        re-review (7679a0f) escalated again on two HIGH findings in the sibling test file. So the
        SQL was verified by both author and reviewer; the TEST supposed to prove it was found
        vacuous only by the reviewer."
      residual_risk: "Whether any real artist attempted a collection write while 0120 was live and
        unrepaired. No production telemetry or row count is cited in the repo."
    disclosure:
      public_repo_safe: true
      redactions_applied: "Evidence is cited by path, symbol and commit rather than reproduced. No
        secrets, personal data, production rows or runnable exploit steps."
