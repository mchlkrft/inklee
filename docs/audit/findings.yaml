  - id: "AUTH-RLS-002"
    title: "discount_codes had the identical SELECT-only RLS defect, live in production on the revenue
      path, from 0118 until 2026-07-29"
    summary: "0118 created discount_codes with RLS enabled and a single SELECT policy. Both write
      callers (web action and mobile route) pass a user-scoped client, so every artist INSERT/UPDATE
      returned 42501, which saveDiscountCore mapped to the transient-sounding 'Couldn't save. Try
      again.' for a permanent condition. Found by the independent Gate A reviewer while checking a
      neighbouring claim, not by the feature author. Repaired by 0123 and hotfixed to production
      ahead of the branch merge."
    classification:
      domain: "authorization"
      category: "missing-authorization"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-29"
      detected_by: "repository backfill from committed evidence (2026-07-30)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "f090956"
      environment: "repository-only"
      discovery_context: "Backfilled during the initial build of this register. Evidence was read from
        committed code, migrations, review artifacts and commit messages already in the repository;
        it was not reconstructed from conversational memory."
    location:
      files:
        - "apps/web/supabase/migrations/0118_goods_discounts.sql"
        - "apps/web/supabase/migrations/0123_discount_codes_write_policies.sql"
        - "apps/web/src/lib/server/discount-write.ts"
        - "apps/web/src/app/(artist)/goods/discounts/actions.ts"
        - "apps/web/src/app/api/mobile/goods/discounts/route.ts"
        - "docs/product/p5d-gate-a-specialist-review.md"
      database_objects:
        - "discount_codes"
    evidence:
      observed_facts:
        - "apps/web/supabase/migrations/0118_goods_discounts.sql:50 `alter table discount_codes
          enable row level security;` and :52-53 the only policy on that table, `for select using
          (artist_id = auth.uid())` — note also no `TO` clause."
        - "apps/web/src/app/(artist)/goods/discounts/actions.ts:27 `const { supabase, userId } =
          await artist();` then :31 `saveDiscountCore(supabase, ...)`;
          apps/web/src/app/api/mobile/goods/discounts/route.ts:88 passes the request-scoped
          `supabase` to the same core. Neither uses serviceClient."
        - "apps/web/supabase/migrations/0123_discount_codes_write_policies.sql:38-48 grants INSERT
          and UPDATE `to authenticated` only. No DELETE, deliberately: setDiscountActiveCore
          deactivates so redemption history survives."
        - "Commit add324a (2026-07-29 13:00) is the standalone production hotfix, deliberately
          carrying only the minimum harness (vitest.db.config.ts, tests/db/helpers/db-env.ts, the
          test:db script) and none of the P5d collection migrations."
        - "add324a records independent production evidence: 'Production check (read-only, service
          role, 2026-07-29): `select count(*) from discount_codes` returns 0. Zero rows in
          production, consistent with the write path having been blocked since 0118 shipped.'"
        - "docs/product/p5d-gate-a-specialist-review.md:22-31 lists this as finding A2:
          'discount_codes carries the identical defect, unrepaired, already in production, on the
          revenue path.'"
      references:
        - "apps/web/supabase/migrations/0118_goods_discounts.sql"
        - "apps/web/supabase/migrations/0123_discount_codes_write_policies.sql"
        - "apps/web/src/lib/server/discount-write.ts"
        - "apps/web/src/app/(artist)/goods/discounts/actions.ts"
        - "apps/web/src/app/api/mobile/goods/discounts/route.ts"
        - "docs/product/p5d-gate-a-specialist-review.md"
      contradictory_evidence: "0121's original header comment asserted discount_codes was a healthy
        precedent. That claim was false and is corrected in f090956, with the false claim recorded
        rather than deleted."
      inspected_comparables_without_issue:
        - "discount_redemptions (0118:76-79) is also SELECT-only but writes via serviceClient
          (apps/web/src/lib/server/discounts.ts:157) — inspected, correct."
    assessment:
      interpretation: "This is the strongest single piece of evidence that the RLS defect is a PATTERN and
        not an incident: two tables, two features, two migrations, same wrong reasoning, one of them
        live on the revenue path for weeks. It was found only because a reviewer refused to take a
        neighbouring claim on trust."
      root_cause_hypothesis: "Same as the collections case: policy shape copied from a sibling without
        establishing which client writes. Compounded by error mapping — saveDiscountCore renders a
        permanent 42501 as 'Couldn't save. Try again.', which reads as transient and suppresses
        escalation."
      reachability: "directly-reachable"
      impact_status: "historically-impacting"
      production_exposure: "0118 was applied to production and the defect was live there until add324a on
        2026-07-29. Every artist attempt to create or edit a discount code failed. Blast radius
        bounded by adoption, which the count=0 query suggests was zero completed saves."
      remaining_uncertainty: "Whether any artist abandoned the feature because of the transient-sounding
        error, and whether support tickets exist for it. Not investigated."
    relationships:
      analogous_uninspected_areas:
