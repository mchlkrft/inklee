  - id: "BILL-ENT-002"
    title: "OPEN: account deletion cancels PaymentIntents but never the subscription, and all nine
      billing/tax tables cascade-delete with the profile"
    summary: "The deletion path cancels live unpaid PaymentIntents and then deletes the profiles row. It
      contains no reference to billing_subscriptions, Stripe subscription cancellation, or any
      billing table. All nine billing/tax tables in migration 0106 declare `references profiles(id)
      on delete cascade`, so deleting the profile destroys the records the Terms promise to retain,
