        committed code, migrations, review artifacts and commit messages already in the repository;
        it was not reconstructed from conversational memory."
    location:
      files:
        - "apps/web/src/lib/stripe-connect.ts"
        - "AGENTS.md"
        - "docs/artist-account-and-payouts.md"
      database_objects:
        - "profiles.stripe_account_status"
        - "profiles.stripe_charges_enabled"
        - "profiles.stripe_account_id"
    evidence:
      observed_facts:
