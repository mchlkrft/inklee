        - "apps/web/src/lib/email/send-booking-email.ts:89-92 `} catch (err) { // Emails are
          best-effort — log and continue, never block the state change  console.error(...) }` — same
          shape at :308 and :355 for the artist deposit-paid and client receipt emails."
        - "route.ts:786-788 `if (!bookingSideRanThisCall && !orderFlippedThisCall) { return ...
