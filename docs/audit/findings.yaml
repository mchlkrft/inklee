          { free: 500, plus: 100 }."
        - "fee-schedule.ts feeMinorUnits: returns 0 when bps is null or <= 0, so a 'free' tier
          appointment fee under v2 is 0, indistinguishable from 'no fee'."
        - "plus-capability-registry.ts:411 legacyBehavior 'UNDEFINED for legacy_free_v1 (flagged:
          which rate?)' (deposit fee), and :435 'UNDEFINED (flagged)' (goods fee)."
        - "plus-capability-registry.ts:309: the legacy_free_v1 cohort carries the deposits override,
          so such an artist CAN transact card payments despite being tier 'free'."
      references:
