      growth views are wide open locally and correctly locked in production"
    summary: "apps/web/supabase/seed.sql runs after migrations on `supabase db reset`
      (config.toml:60-65) and line 16-17 executes `GRANT ALL ON ALL TABLES IN SCHEMA public TO anon,
      authenticated, service_role`. That undoes every table-level REVOKE the migrations performed.
      The file re-applies a manually curated subset (0062, 0079, 0125, 0074/0076/0084/0102) and
      explicitly warns at lines 32-38 that the list must be maintained. It omits 0067:611-612 and
      0069:316, so on the local stack anon and authenticated hold ALL privileges on
      growth_activity_events and growth_artist_stats, which production correctly restricts to
