  - id: "PAY-CONN-001"
    title: "Cached Connect state asserted a routing capability Stripe denied, and the first corrective
      predicate was broad enough to downgrade the entire artist fleet on one platform-scope fault"
    summary: "profiles.stripe_account_status and stripe_charges_enabled are a snapshot of the last
      successful sync. Accounts onboarded before the 2026-07-04 live-key cutover stayed 'active'
      while invisible to the live key, so the app kept believing artists were routable. The
      corrective predicate isConnectAccountUnreachable initially treated every Stripe 403 as
      account-specific; stripe-node maps ALL 403s to StripePermissionError, so a restricted or
      rotated platform key would have knocked every artist requesting a deposit onto manual deposits
      at once."
