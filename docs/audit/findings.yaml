      minor-unit amount alone cannot distinguish 100 EUR from 100 SEK'. The condition begins `!order
      &&`, so the check is skipped entirely whenever the intent carries an `order_id`. The reason it
      does not currently bite is upstream, not here: the checkout prepare step refuses add-ons
      unless the deposit currency is EUR. A backstop whose correctness depends on the path it is
      backstopping is not a backstop."
