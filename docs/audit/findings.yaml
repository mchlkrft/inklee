  - id: "TEST-VAC-001"
    title: "Tests incapable of failing, found in at least five independent rounds, including the suite
      written specifically to prove an RLS repair"
    summary: "The repo has repeatedly shipped tests that pass regardless of whether the code under test
      works. Documented instances span a whole suite that never executed, eight RLS tests satisfied
      by universal rejection, a catalog sentinel matched by a code comment, seven money-floor tests
      that measured a check constraint instead of the policy, a branch measured by nothing at all,
      and a test passing by mutual zero. Every one was found by someone other than the test's
      author."
