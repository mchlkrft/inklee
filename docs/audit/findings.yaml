  - id: "WHK-RFD-001"
    title: "charge.refunded records at most one audit row per booking carrying the first cumulative
      amount, so a partial refund is indistinguishable from a full one and later partials are never
      recorded"
    summary: "route.ts:220-248 writes a `deposit_refunded` audit row only when the existing count is
      zero, and stores `amount_eur: (charge.amount_refunded ?? 0) / 100` with no comparison against
