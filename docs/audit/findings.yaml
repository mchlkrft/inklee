      environment: "repository-only"
      discovery_context: "Backfilled during the initial build of this register. Evidence was read from
        committed code, migrations, review artifacts and commit messages already in the repository;
        it was not reconstructed from conversational memory."
    location:
      files:
        - "apps/web/supabase/migrations/0099_release_fee_sponsorship_on_refund.sql"
