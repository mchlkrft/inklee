  - id: "WHK-RTY-001"
    title: "The file identifies Stripe endpoint auto-disabling as a hazard in one branch and then
      returns 4xx from six other branches for permanently unsatisfiable conditions"
    summary: "route.ts:379-387 explains at length that a foreign PaymentIntent must be 200'd so it is
      'never counted as a failed delivery that could push Stripe toward auto-disabling this endpoint
      (which would strand real deposits)'. Six other branches then return 404 or 409 for conditions
      that will never become true on retry, so Stripe retries each for its full ~3-day schedule and
      counts every attempt as a failure. The 404 at :402 is the sharpest: `audit_log.booking_id` is
      `ON DELETE cascade` and booking rows are deleted by account deletion and by the cleanup cron,
      so a deleted booking produces an event that 404s on every redelivery, permanently."
