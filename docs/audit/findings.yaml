          redelivery cannot change."
        - "The 500s are different and defensible: :604-608 (updateError) and :211-216 (fee release
          failure) are genuinely retryable and the comment at :85-89 argues for the retry
          explicitly."
        - "apps/web/supabase/migrations/0000_calm_gressill.sql:71
          `audit_log_booking_id_booking_requests_id_fk ... ON DELETE cascade` — bookings are
          deletable, so :402 is reachable for real historical payments."
        - "route.ts:121-126 returns 400 when `STRIPE_SECRET_KEY` or `STRIPE_WEBHOOK_SECRET` is
          unset, with no Sentry capture: a misconfigured deployment fails 100% of deliveries
          silently from the app's side."
      references:
