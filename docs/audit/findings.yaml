  - id: "PAY-RFD-002"
    title: "Fee refund policy v1 'retain non-recoverable' retains the whole platform fee, not the
      actual Stripe cost"
    summary: "Counsel approved v1's artist-cancellation 'retain non-recoverable' rule on the condition
      that the retained amount equal the actual auditable per-transaction Stripe cost (cost, not
      margin). In v1 that treatment resolves to returnMinor: null ('not computable'), and the only
      money-moving consumer maps it to refund_application_fee: false, which retains the whole
      application fee (cost + margin). No per-transaction non-recoverable-cost computation exists.
      v1 is NOT the active policy version (v0 is), so there is no live violation today; this is a
      blocker on the v1 activation counsel conditioned."
    classification:
      domain: "payment"
      category: "money-correctness"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-31"
      detected_by: "counsel/accountant answer processing: fee-refund-policy verification (subagent)"
      repository: "mchlkrft/inklee"
      branch: "feat/p5d-collections"
      commit: "56980a8"
      environment: "local"
      discovery_context: "Verifying the three F2 conditions counsel attached to approving fee refund
        policy v1 (Terms first; cost-not-margin; client unaffected)."
    location:
      files:
        - "packages/shared/src/fee-refund-policy.ts"
        - "apps/web/src/lib/server/appointment-payment-refund.ts"
      symbols:
        - "feeRefundOutcome"
        - "FEE_REFUND_POLICY_V1"
    evidence:
      observed_facts:
        - "fee-refund-policy.ts: FEE_REFUND_POLICY_V1 maps artist_cancellation to treatment
          'retain_non_recoverable'."
        - "fee-refund-policy.ts (~150-152): the retain_non_recoverable branch returns
          { returnMinor: null } with the comment 'Not computable: needs the legal and contractual
          position'."
        - "fee-refund-policy.ts: ACTIVE_FEE_REFUND_POLICY_VERSION = FEE_REFUND_POLICY_V0.version
          (v0 artist_cancellation = return_full), so v1 is not active."
        - "appointment-payment-refund.ts (~180-193): shouldRefundFee is true only for
          return_full/return_proportional; for retain_non_recoverable it calls Stripe with
          refund_application_fee: false, retaining the entire application fee, and stamps
          fee_return_minor String(feeOutcome.returnMinor ?? 0) = '0'."
        - "No per-transaction non-recoverable Stripe-cost computation exists (grep for
          balance_transaction / non-recoverable / processing fee across platform-fee.ts and
          appointment-payment-settlement.ts returned no matches)."
      references:
        - "packages/shared/src/fee-refund-policy.ts"
        - "apps/web/src/lib/server/appointment-payment-refund.ts"
        - "docs/legal/plus-launch-handoff.md (F2 answer)"
      reproduction: "Independently reproduced by a separate inklee-verifier instance (2026-07-31,
        branch feat/p5d-collections); all three sub-claims confirmed, adversarial refutation failed.
        ENGINE (executed): npx vitest run src/lib/__tests__/fee-refund-policy.test.ts -> 13/13;
        fee-refund-policy.test.ts:94-103 asserts v1 artist_cancellation -> treatment
        retain_non_recoverable and returnMinor null. CONSUMER MECHANISM (executed): the identical
        shouldRefundFee false-branch runs through the real refund core in
        appointment-payment-refund.test.ts:303-320 (dispute case, v0 retain_where_permitted ->
        refund_application_fee:false), and appointment-payment-refund.test.ts:283-301 proves the v0
        artist_cancellation path returns refund_application_fee:true. application_fee_amount is the
        full 3% platform fee (platform-fee.ts:8), so refund_application_fee:false retains cost+margin.
        The v1-specific literal cannot flow through the real core (the core is hardwired to ACTIVE
        and its input type has no version field), which is itself the latency property, so the v1 tie
        is by code read of the shared boolean plus the engine-level version-override test.
        Adversarial: no second consumer, no balance_transaction cost computation anywhere, no
        refund_application_fee_amount partial path, no version-override caller route."
      contradictory_evidence: "None for condition (2). Condition (3) client-unaffected DOES hold in
        code (the client refund is computed independently of the fee treatment; the deposit path
        makes the client whole on artist cancellation), so this finding is scoped to condition (2).
        The independent pass also positively re-confirmed condition (3): refund amount is computed
        from allocations independently of feeOutcome, so refund_application_fee only splits the
        Inklee<->artist share."
      inspected_comparables_without_issue:
        - "bookings.ts refundDepositCore: on artist cancellation the client's deposit is fully
          refunded (reverse_transfer + refund_application_fee true); retention operates strictly
          Inklee<->artist, so F2 condition (3) is satisfied."
    assessment:
      interpretation: "The v1 policy counsel approved is not implemented to the cost-only condition:
        it retains the whole fee, which is exactly the 'margin' outcome counsel said would drift
        toward an unenforceable penalty."
      root_cause_hypothesis: "v1 was defined as data/mapping (retain_non_recoverable) but the engine
        and the refund consumer were never extended to compute the actual Stripe cost; the treatment
        was left as a deferred manual decision (returnMinor null)."
      reachability: "currently-unreachable"
      impact_status: "latent"
      production_exposure: "None today: ACTIVE_FEE_REFUND_POLICY_VERSION is v0. Becomes reachable the
        moment v1 is activated."
      remaining_uncertainty: "The engine outcome (v1 -> retain_non_recoverable/null) and the
        consumer's shouldRefundFee false-branch are both execution-verified, and the reachability
        (ACTIVE=v0, no version override) is execution-verified. The ONLY part not run end-to-end is
        the v1 literal flowing through the real refund core, and it cannot be, by construction: the
        core is hardwired to ACTIVE with no version parameter. That impossibility IS the latency
        property, not a gap in the evidence."
    relationships:
      related_findings:
        - "PAY-FEE-004"
      analogous_uninspected_areas:
        - "The deposit refund path (refundDepositCore) hardcodes refund_application_fee: true and is
          not wired into fee-refund-policy at all; whether artist-cancellation deposit refunds should
          retain a non-recoverable cost under v1 was not decided."
    remediation:
      status: "fixed-unverified"
      fix_commit: "bdfc132"
      fixed_at: "2026-07-31"
      proposed_action: "Implemented in bdfc132. Engine (fee-refund-policy.ts): feeRefundOutcome takes
        the actual nonRecoverableCostMinor + alreadyRetainedMinor and returns a retainMinor/returnMinor
        split; retain_non_recoverable retains min(cost, fee) proportional to the refund, capped by the
        remaining retainable and the fee touched, and returns null (fail-safe) when the cost is
        absent. Core (appointment-payment-refund.ts): resolves the policy version from the persisted
        collection stamp (never client input), reads the proven cost from payment_collections, returns
        the margin via a partial application-fee refund, records retained cost to prevent
        double-retention, and returns the FULL fee (retains nothing) when the cost is unavailable.
        Settlement (appointment-payment-settlement.ts): captures the actual cost from the charge's
        balance_transaction and stamps the policy version + app fee. Migration 0131 persists cost +
        source + status + stamp + retained on payment_collections. Activation stays gated: ACTIVE is
        v0 and settlement stamps v1 only when FEE_REFUND_V1_ACTIVATION_ENABLED. STILL OPEN before
        activation: F2 condition (1) Terms disclosure; run 0131 to prod; real reconciliation of the
        cost; the fee-refund approval key current against this implementation."
    verification:
      status: "pending"
      independent: false
      verification_method: "Red-green through the REAL refund core. 8 v1 end-to-end tests
        (appointment-payment-refund.test.ts): retain only the proven cost / return the margin; zero
        cost retains zero; cost >= fee caps at the fee; partial refund allocates proportionally;
        repeated refunds do not double-retain; missing cost FAILS SAFE by returning the full fee (not
        retaining it); voluntary (client-cancellation) unchanged; version resolves from the persisted
        stamp. Plus 8 engine unit tests. Two mutations confirmed the tests discriminate: flipping the
        fail-safe branch to refund_application_fee:false (the original PAY-RFD-002 defect) reddened the
        fail-safe test, and setting partialFeeRefundMinor=0 (whole-fee retention) reddened the
        retention test; both restored. Full web suite 2525 pass + 1 expected fail; typecheck + lint
        clean."
      residual_risk: "NOT independently verified: the founder instruction for this finding was
        explicitly not to commission another verifier, so the fix is author-tested (red-green,
        mutation-proven) but not confirmed by a separate instance. The v1 path is proven through the
        real core with a MOCKED Stripe and an in-memory service client; it has never run against real
        Stripe or real Postgres, so the exact application-fee-refund semantics and the 0131 migration
        convergence are unproven until activation (G-5). v1 remains inactive (ACTIVE=v0;
        FEE_REFUND_V1_ACTIVATION off), so there is no live exposure. The processor_cost_retained_minor
        increment is add-a-delta at refund initiation (single-shot per artist action, not a
        redelivered webhook); reconciliation should true it up if an increment write is lost."
    disclosure:
      public_repo_safe: true
    history:
      - date: "2026-07-31"
        actor: "counsel-answer processing (verification subagent)"
        action: "opened"
        note: "Found while verifying counsel's F2 cost-only condition against the v1 implementation."
      - date: "2026-07-31"
        actor: "inklee-verifier (independent instance)"
        action: "evidence-added"
        note: "Independently CONFIRMED all three sub-claims by execution (engine test 13/13; consumer
          false-branch executed via the dispute case; reachability proven ACTIVE=v0 with no override).
          Adversarial refutation failed on every angle. confidence stays 'confirmed', now backed by a
          reproduction, not reading alone. remediation stays open (no fix); verification.status stays
          not-started because there is no fix to verify, only a confirmed defect."
      - date: "2026-07-31"
        actor: "engineering (remediation)"
        action: "fix-committed"
        note: "Cost-only retention implemented in bdfc132 (engine split + persisted processor cost +
          fail-safe + activation gate + migration 0131). Author-tested red-green through the real core
          with two mutations; independent verification of the FIX deferred per the founder instruction
          not to commission another verifier for this finding. v1 stays inactive."

  - id: "BILL-CONF-001"
    title: "Durable purchase confirmation could silently ship without the inline Terms text on a
      fail-soft path"
    summary: "The Art. 8(7) purchase confirmation composes the accepted Terms text inline from the
      on-disk version snapshot. If the snapshot read throws or the terms_acceptance consent row is
      missing at send time, termsSection becomes '' and the email ships without the Terms text while
      still stamping terms_version and marking delivery 'sent' — a durable-medium gap with no
      signal. A real purchase cannot reach this (checkout fails closed on the Terms read), so it is
      an edge, but it was silent. Mitigated by a Sentry warning on that branch."
    classification:
      domain: "billing"
      category: "silent-failure"
      severity: "low"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-31"
      detected_by: "counsel/accountant answer processing: E2 durable-medium verification (subagent)"
      repository: "mchlkrft/inklee"
      branch: "feat/p5d-collections"
      commit: "56980a8"
      environment: "local"
      discovery_context: "Verifying counsel's E2 escape hatch (the billing_contract_confirmations
        flow carries the Art. 8(7) set), which it does; this is the residual on the fail-soft path."
    location:
      files:
        - "apps/web/src/lib/server/billing/withdrawal.ts"
      symbols:
        - "recordDurableConfirmation"
        - "readTermsSnapshot"
    evidence:
      observed_facts:
        - "withdrawal.ts readTermsSnapshot: catch returns null on any read failure."
        - "withdrawal.ts purchase branch: termsSection = termsText ? <terms> : '' — an empty section
          when termsText is null, with no alert prior to the 2026-07-31 change."
        - "The confirmation row is still inserted with terms_version stamped and later marked 'sent',
          so a terms-less send left no trace."
        - "The happy path composes all three Art. 8(7) items inline (Terms version + text, withdrawal
          instructions, price + renewal); price/renewal has its own non-empty fallback string."
      references:
        - "apps/web/src/lib/server/billing/withdrawal.ts"
        - "docs/legal/plus-launch-handoff.md (E2 answer)"
      contradictory_evidence: "In practice unreachable on a real purchase: checkout fails closed on
        the Terms read (actions.ts getLegalDoc catch), so a live buyer always has a resolvable
        version whose snapshot ships with the deployment."
      inspected_comparables_without_issue:
        - "The withdrawal and cancellation branches do not carry a Terms section, so the fail-soft is
          specific to the purchase branch."
    assessment:
      interpretation: "A silent degradation of a legal artifact (the durable-medium confirmation) is
        the class of defect the money/legal rules treat as unacceptable even on rare paths; making
        it observable is the minimum, without blocking the statutory confirmation."
      root_cause_hypothesis: "termsSection was made fail-soft to keep the statutory confirmation
        unblocked, and the observability of the degraded path was overlooked."
      reachability: "conditionally-reachable"
      impact_status: "latent"
      production_exposure: "No evidence any confirmation shipped terms-less; there was no signal, so
        absence of evidence is not evidence of absence. The snapshot is committed and deploys with
        the app, making the read failure unlikely."
      remaining_uncertainty: "Whether any historical purchase confirmation shipped without the Terms
        text is unknowable retroactively (no prior signal). Going forward the Sentry warning covers
        it."
    relationships:
      analogous_uninspected_areas:
        - "Any other durable-medium artifact composed with a fail-soft read (none found in the
          withdrawal/cancellation branches, but not swept repo-wide)."
    remediation:
      status: "mitigated"
      fix_commit: "8e75dcc"
      proposed_action: "Observability added (Sentry warning) so the fail-soft is no longer silent. A
        stronger fix would refuse or retry rather than send a terms-less confirmation, but it must
        not block the statutory confirmation; deferred as a judgement call."
      fixed_at: "2026-07-31"
    verification:
      status: "passed"
      independent: true
      verified_by: "inklee-verifier (separate instance, read-only) for the code change"
      verified_at: "2026-07-31"
      verification_commit: "8e75dcc"
      verification_method: "inklee-verifier confirmed the captureMessage fires ONLY on the fail-soft
        branch, alters no control flow, blocks no send, and logs no PII (UUID artistId + version
        string + enum reason); the three Art. 8(7) items remain composed inline on the happy path.
        It also flagged that the @sentry/nextjs test mock lacked captureMessage, so a future fail-soft
        test would throw undefined and mark delivery failed. That mock was hardened and two red-green
        tests added (withdrawal.test.ts): both assert captureMessage fires (reason snapshot_unreadable
        / no_terms_version) AND the email still sends; both go red when the if(!termsText) block is
        removed (mutation confirmed)."
      residual_risk: "The email still sends without the Terms text on the degraded path; only the
        silence is fixed. The added tests were authored by the same instance that added the
        observability, so the tests themselves are not independently reviewed."
    disclosure:
      public_repo_safe: true
    history:
      - date: "2026-07-31"
        actor: "counsel-answer processing (verification subagent)"
        action: "opened"
        note: "Residual flagged while confirming E2 carries the Art. 8(7) set."
      - date: "2026-07-31"
        actor: "engineering (answer processing)"
        action: "fix-committed"
        note: "Sentry warning added on the terms-less purchase-confirmation branch (8e75dcc)."
      - date: "2026-07-31"
        actor: "inklee-verifier (independent)"
        action: "verified"
        note: "Production path VERIFIED; flagged the test-mock gap, which was then closed with two
          red-green fail-soft tests."

