        - "apps/web/src/lib/server/storage-purge.ts:7-9 states the rule explicitly ('Supabase
          .list() is non-recursive ... returns at most limit entries with no continuation, so we
          descend each level AND paginate it - otherwise a busy artist's files are silently missed')
          and implements it at :10-33."
        - "storage-purge.ts:35-37 - 'A transient storage error never throws ... and the nightly
          cleanup cron reconciles any remainder.' The cleanup cron performs no such reconciliation:
          it only lists folders derived from booking_requests rows that still exist (route.ts:23-27,
