  - id: "BDEL-CON-001"
    title: "Counsel decision 7 on the Connected Account is half implemented: the pointer is retained but
      the scheduled account deletion at window-end was never built, and the pointer is purged at
      seven years"
    summary: "docs/account-deletion-handoff.md row 7 directs: retain account pointer only, schedule
      account deletion at window-end with zero balance required, do not force-disconnect at deletion
      time. The code implements the first and third clauses and not the second. No Stripe account
      deletion or rejection call exists anywhere in the codebase, and no cron references
      stripe_account_id. After the 7-year retention purge removes deleted_account_records, the
      Connect account is permanently orphaned with no pointer left to find it by."
    classification:
      domain: "billing"
      category: "process-gap"
      severity: "medium"
      confidence: "confirmed"
