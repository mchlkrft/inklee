          status=active/charges_enabled=true from the test-mode sync, so the app kept believing the
          artists were routable and kept silently producing manual deposits.'"
        - "Commit 0a25c66 (2026-07-21): 'Stripe maps EVERY 403 to StripePermissionError, so a
          platform-level fault (a restricted or rotated secret key without Connect scope) looked
          identical to \"this acct_ is not usable by our key\" and would have downgraded every
          artist who requested a deposit during that window, leaving each one on manual deposits
          until they individually hit Refresh status. It now requires the error to actually name the
          account being charged.'"
        - "AGENTS.md encodes the rule verbatim, including 'Never auto-clear stripe_account_id: a
          status downgrade is undone by the next sync, wiping ids is not.'"
        - "The accepted residual is recorded in both 0a25c66 and AGENTS.md: 'ensureConnectAccount
          reuses a stored account id, so an artist whose account is genuinely gone still needs an
          admin to clear the field before they can re-onboard.'"
        - "apps/web/src/lib/stripe-connect.ts:212 is `ensureConnectAccount`; :569 carries the
          comment about the dead-id admin action — the residual is still present in the code today,
          as designed."
