    assessment:
      interpretation: "OBSERVED: one of three clauses in a counsel-ratified decision is unimplemented.
        INTERPRETATION: because the artist's funds sit in their own Connect account and Stripe holds
        KYC as an independent controller (stated in privacy.md:101), leaving the account alive is
