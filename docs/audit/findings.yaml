      payment_allocations (line 1400). seed.sql mirrors only the second (lines 69-70). After
      supabase db reset, the blanket GRANT ALL ON ALL TABLES (seed.sql:16-17) re-grants INSERT,
      UPDATE, DELETE and TRUNCATE on payment_collections to anon and authenticated. RLS with no
      permissive write policy blocks I/U/D, but TRUNCATE ignores RLS entirely, so authenticated
      can empty the table on the local stack."
