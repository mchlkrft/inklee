  - id: "DATA-RACE-001"
    title: "READ COMMITTED single-statement snapshots defeated two separate safety mechanisms, each
      shipped with a written claim of atomicity that had never been executed"
    summary: "The same misunderstanding of READ COMMITTED produced two defects a day apart. In 0124, a
      single `delete ... where not exists (child)` was shipped as 'atomic'; it waits on the
      concurrent inserter's FOR KEY SHARE lock but does not re-evaluate its subquery on unblocking,
      so it deletes a collection that just gained a product and reports success. In 0125/0126, the
      payment-request freeze trigger read the parent's sent_at with no lock and no re-check,
      admitting line writes into an already-SENT request."
    classification:
      domain: "database"
      category: "concurrency"
      severity: "high"
      confidence: "confirmed"
    discovery:
      detected_at: "2026-07-29"
      detected_by: "repository backfill from committed evidence (2026-07-30)"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "9bb8d0a"
      environment: "repository-only"
      discovery_context: "Backfilled during the initial build of this register. Evidence was read from
        committed code, migrations, review artifacts and commit messages already in the repository;
        it was not reconstructed from conversational memory."
    location:
      files:
        - "apps/web/supabase/migrations/0124_delete_collection_atomic.sql"
        - "apps/web/supabase/migrations/0125_appointment_payments.sql"
        - "apps/web/supabase/migrations/0126_payment_request_send.sql"
        - "apps/web/src/lib/server/collections.ts"
        - "apps/web/tests/db/collection-delete-race.test.ts"
        - "apps/web/tests/db/payment-request-lines-freeze-race.test.ts"
      database_objects:
        - "product_collections"
        - "product_collection_items"
        - "payment_requests"
        - "payment_request_lines"
    evidence:
      observed_facts:
        - "Commit 9bb8d0a (2026-07-29 14:33) retracts the atomicity claim in place: 'The claim was
          never executed. It is false. Under READ COMMITTED a single statement evaluates its
          subqueries against one snapshot; a concurrent insert takes FOR KEY SHARE on the parent, so
          the DELETE waits on the lock but never re-evaluates not exists.'"
        - "Timestamped reproduction, 9bb8d0a: 'deleter called the RPC at 07:30:41.175, the writer
          COMMITted its membership at 07:30:45.593, and the RPC returned deleted at 07:30:45.594,
          1.1ms later. Collection gone, membership gone, product orphaned.' Reproduced three times
          independently by three different agents with different fixtures; a fourth in 4d406f9."
        - "Fix mechanism, 4d406f9: 'Fixed by locking the parent FOR UPDATE in its OWN earlier
          statement ... being a separate statement is what matters: each statement takes a fresh
          snapshot. The one-statement version waited on the very same lock and still lost.'"
        - "Same class, money path, 0b42f2d (2026-07-30): 'The freeze was defeated by an ordinary
          concurrent line write, 19 of 20 through the real product path with no held transaction.
          The lines trigger read the parent's sent_at with no lock and no re-check, so under READ
          COMMITTED it saw the pre-freeze parent and admitted the write, leaving a SENT request with
          total=10000 and sum(lines)=6000. This is the 0124 lesson, in a file whose own header cites
          0124.' Fixed the same way: 0/90 across three variants."
        - "A deliberate REVERSAL is recorded rather than hidden, 0b42f2d: 0126's read-side lock was
          removed because it produced 'a deterministic 40P01, 3 of 3, superuser and authenticated
          alike, whose victim was the ARTIST's ordinary line edit'. Replaced by a catalog sentinel
          test."
        - "Commit 675152b (2026-07-30) then corrects the test file's own docstring, which still
          asserted the removed lock existed: 'a comment asserting a safety property that has not
          been executed tells the next reader not to look.'"
        - "Commit 7d6773b (2026-07-30) closes the last uncovered variant (UPDATE during freeze) with
          a mutation proof: stripping `for share` from the deployed trigger body makes the new test
          fail with the damage itself, while the CONTROL ('a line write on an UNSENT request still
          succeeds') stays green."
        - "The delete path had ZERO test coverage before this: 9bb8d0a records 'the RPC has zero
          test coverage; unit stayed at exactly 2028 and db at exactly 36 across the rewrite, which
          is the tell.' docs/product/p5d-gate-c-review.md:142-143 confirms it independently."
      references:
        - "apps/web/supabase/migrations/0124_delete_collection_atomic.sql"
        - "apps/web/supabase/migrations/0125_appointment_payments.sql"
        - "apps/web/supabase/migrations/0126_payment_request_send.sql"
        - "apps/web/src/lib/server/collections.ts"
        - "apps/web/tests/db/collection-delete-race.test.ts"
        - "apps/web/tests/db/payment-request-lines-freeze-race.test.ts"
      contradictory_evidence: "docs/product/p5d-gate-c-review.md gave milestone 3's delete-eligibility
        rule a CLEAN verdict. The TOCTOU was in that exact code. The doc records this against itself
        at :49-56."
      inspected_comparables_without_issue:
        - "apps/web/supabase/migrations/0100_fee_sponsorship_booked_ledger.sql's converge-to-target
          RPC moves the difference 'under a row lock' per bcb45d5 — a comparable pattern designed
          with the lock from the start."
    assessment:
      interpretation: "The generalisation is the rule this session produced: behavioural evidence is
        required when a claim's truth depends on a SEQUENCE or a STATE TRANSITION. Both defects were
        argued correct in prose, both passed every sequential test, and both were false. Gate C
        reviewed the delete path and passed it (docs/product/p5d-gate-c-review.md:120-126 says so
        explicitly)."
      root_cause_hypothesis: "A single SQL statement is intuitively read as 'happens at one instant'.
        Under READ COMMITTED it is not: it takes one snapshot at statement start, and blocking on a
        row lock does NOT refresh that snapshot. Both defects substitute statement atomicity for
        serialisable semantics."
      reachability: "directly-reachable"
      impact_status: "reachable-no-known-impact"
      production_exposure: "NONE ESTABLISHED for either. 0124 was on an unmerged branch when found; the
        merge (99e39e1) carries the fixed version. 0125/0126 are branch-only behind the
        `appointment_payments` kill switch with no artist able to reach them (0b42f2d: 'Branch-only,
        activates nothing')."
      remaining_uncertainty: "Whether any collection was actually destroyed by the race between 0124's
        first version and 4d406f9; both are same-day and branch-only. Separately:
        docs/product/p5d-gate-c-review.md was created at 21458a0 (16:14:32), four minutes AFTER
        4d406f9 (16:10:10), and still states at :124-126 that the TOCTOU 'is still open' and at
