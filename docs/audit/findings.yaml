    evidence: "A4 shipped with no test of any kind; its own behavioural evidence came from throwaway
      probes that were deleted. This pass turned that into a gate:
      apps/web/tests/db/appointment-payment-settlement.test.ts, 26 tests (25 passing plus one
      documented `it.fails` tripwire), which took the db suite from 191 to 217. WHAT IS REAL IN IT:
      the local Postgres with its constraints, triggers, grants and RLS; the
      `converge_payment_refund` RPC from 0128; the RLS-bypassing service client the cores are handed
      in production; the artist's own anon-key client holding a real JWT; the three settlement
      cores; and the webhook route driven end to end through Stripe's REAL HMAC verification
      (`webhooks.generateTestHeaderString`), so the HTTP status codes asserted are the ones a Stripe
      delivery would receive. WHAT IS NOT REAL: the Stripe API (no key is reachable; event payloads
      are hand-built to the documented shape). OBLIGATIONS DISCHARGED, one block each: redelivery is
      a no-op (one allocation set, one state move, the SAME row ids, and the fee actuals caught up
      after a delivery that died between the two writes); an older event never overwrites newer
      state (both for the request status and for a superseded intent); refund convergence (3000 then
      5000 is 5000 in ONE row, a late older 3000 answers `stale` and does not reduce it, a plain
      redelivery answers `unchanged`, an over-refund clamps at the collected total and the net never
      goes negative); partial payment (proportional shares summing to exactly what Stripe moved,
      line-attributed rows, and A1's `outstandingBalance` recomputed FROM DISK at 4000/6000 then
      10000/0); mixed service and goods (bases 9000 and 4500 disjoint, tip, tax and shipping in
      neither, and on a half collection the bases are 4500 and 2250 rather than the frozen basket's
      13500); an unknown intent (real 200 with nothing written, a real 500 while the settlement may
      still arrive, and a real 200 once the retry window has passed, which is the BILL-ENT-002
      bound); a failed payment (the artist's OWN client is silently refused from
      `payment_processing`, 0 rows and no error, and succeeds from `failed`, which is the recourse
      property exercised rather than asserted from a constant); forgery (allocation INSERT 42501 by
      privilege, the converge RPC 42501 by grant with a service-role positive control, and the fee
      actuals unchanged); and concurrency (two backends, `pg_blocking_pids` proving contention, the
      older event losing to the newer under the row lock, and a control that still converges
      afterwards). MUTATION CAMPAIGN, 26 mutations, one per test, each stated before it was run,
      applied, run BY NAME with --reporter=verbose, restored, and re-run green. 25 killed their
      test; the reds are logged verbatim in the file header. ONE CAME BACK GREEN AND IS RECORDED AS
      SUCH: the refund-delta mutation does not kill the identical-deliveries race, because the loser
      short-circuits on `v_target = v_recorded` before the arithmetic runs. Two EXISTING tests were
      also checked for vacuity: A4's addition to appointment-payments-convergence.test.ts is NOT
      vacuous (removing 0128 from its repair run goes red naming `payment_collections_bases_check`
      and `payment_collections_fee_minor_check`), and the A3 tripwire A4 converted from `it.fails`
      to `it` still discriminates (reverting the quote to the frozen basket turns it red at 600 <=
      100). FULL GATE after the change: typecheck clean, lint 0 errors and the same 16 pre-existing
      warnings, unit 2375 unchanged, db 216 passed plus 1 expected fail."
