  - id: "PAY-BAL-001"
    title: "deposit and balance payment requests have no subject-scoped ceiling because the stored final
      service price is null in production"
    summary: "appointment-payment-quote.ts:634-642 documents that deposit and balance payment request
      types get no subject-scoped ceiling (resolveFinalServicePrice returns null for any collects
      value other than 'full_price'). The stored final price field (STORED_FINAL_SERVICE_PRICE_MINOR)
      is null in production because A6 (the feature that sets it) is not yet built. Until it exists,
      the only ceiling is request-scoped, and an artist could issue multiple deposit requests that
      in aggregate exceed the service price."
