  - id: "CRON-GSC-001"
    title: "gsc-sync releases the sync lock without checking ownership, so a stale takeover leads to two
      runs holding it"
    summary: "acquireLock is correctly atomic, but releaseLock unconditionally nulls sync_locked_at for
      the connection. After a stale takeover (15 minutes), the original run's finally clears the
      lock the new run holds, admitting a third concurrent run."
    classification:
      domain: "jobs"
      category: "concurrency"
      severity: "low"
      confidence: "high"
    discovery:
      detected_at: "2026-07-30"
      detected_by: "owner-authorized targeted audit: Cron endpoints (apps/web/src/app/api/cron/*) - all
        eight reviewed indi"
      repository: "mchlkrft/inklee"
      branch: "master"
      commit: "87ada6a578ebd16547d45fea667ddfbe443f04e7"
      environment: "repository-only"
      discovery_context: "Produced by an owner-authorized targeted audit scope opened 2026-07-30.
        Read-only inspection; findings returned for supervisor review rather than self-filed."
    location:
      files:
        - "apps/web/src/lib/gsc/sync.ts"
        - "apps/web/src/app/api/cron/gsc-sync/route.ts"
    evidence:
      observed_facts:
        - "apps/web/src/lib/gsc/sync.ts:82-93 - acquireLock is a single UPDATE with
          `.or('sync_locked_at.is.null,sync_locked_at.lt.<stale>')` and `.select('id')`, which is
          race-safe under READ COMMITTED because the predicate is re-evaluated after the blocking
          write commits."
        - "sync.ts:95-100 - releaseLock filters on `.eq('id', connectionId)` only; there is no
          fencing token and no `.eq('sync_locked_at', myTimestamp)`."
        - "SYNC_LOCK_STALE_MINUTES = 15 (sync.ts:26) against maxDuration = 300 s on the route, so a
          run that overruns the platform limit cannot itself become stale, but a run whose lambda is
          frozen or whose upstream call hangs can."
        - "PROD: gsc_connections has 0 rows and last_successful_sync_at is 'never', so
          runScheduledSync returns {skipped:'No active Search Console connection/property.'}
          (sync.ts:218-220) before touching the lock."
      references:
        - "apps/web/src/lib/gsc/sync.ts"
        - "apps/web/src/app/api/cron/gsc-sync/route.ts"
      contradictory_evidence: "None recorded by the audit pass."
      inspected_comparables_without_issue:
        - "acquireLock itself is atomic and correct."
        - "The early return at sync.ts:222-224 happens BEFORE the try, so a run that fails to
          acquire the lock does not fall into the finally and does not release someone else's lock
          on that path."
        - "A partially failed run does not advance last_successful_sync_at (sync.ts:324-329)."
    assessment:
      interpretation: "A textbook missing-fencing-token defect, but currently dead code in production:
        with no connection row the handler exits before acquireLock. The route comment's claim that
        'a lock on the connection prevents overlapping runs' is true for the common case and false
        after a stale takeover."
      root_cause_hypothesis: "The stale-takeover branch was added to the acquire side without a matching
        owner check on the release side."
      reachability: "currently-unreachable"
      impact_status: "latent"
      production_exposure: "None until a Search Console connection is created (memory records GSC OAuth as
        an outstanding founder TO-DO). At that point a daily cron plus a 15-minute stale window
        makes an actual collision unlikely but possible."
      remaining_uncertainty: "I did not read syncDate or the upsert internals, so I cannot say what a
        genuinely concurrent pair of runs would corrupt - the comment claims every write is a
        primary-key upsert, which I did not verify."
    relationships:
      related_findings:
